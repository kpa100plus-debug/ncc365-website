<!doctype html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NCC 소비자회원 가입 | 전국소비자클럽</title>

<meta name="description"
content="전국소비자클럽 무료 회원가입. 상품 무료 경험, 공동구매, 회원 할인, 지역 혜택을 만나보세요.">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
background:#f5f8f6;
color:#25352c;
letter-spacing:-0.02em;
}

.header{
height:75px;
background:#fff;
display:flex;
align-items:center;
padding:0 25px;
border-bottom:1px solid #e5ebe6;
}

.logo img{
width:190px;
display:block;
}

.container{
width:min(720px,92%);
margin:45px auto;
}

.card{
background:#fff;
border-radius:22px;
padding:35px 30px;
box-shadow:0 15px 40px rgba(0,0,0,.06);
}

.eyebrow{
font-size:12px;
font-weight:600;
letter-spacing:.12em;
color:#39805a;
}

h1{
font-size:42px;
line-height:1.15;
margin:12px 0;
letter-spacing:-.05em;
}

h1 span{
color:#50a94b;
}

.subtitle{
font-size:17px;
line-height:1.7;
color:#647168;
}

.benefits{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:25px 0 35px;
}

.benefit{
background:#f3f7f4;
padding:18px;
border-radius:12px;
font-weight:500;
}

.section{
margin-top:32px;
padding-top:28px;
border-top:1px solid #e5ebe6;
}

.section h2{
font-size:20px;
margin:0 0 18px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.form-group{
margin-top:16px;
}

.full{
grid-column:1/-1;
}

label{
display:block;
font-size:14px;
font-weight:500;
margin-bottom:7px;
}

input,
select{
width:100%;
padding:15px;
border:1px solid #d6dfd9;
border-radius:10px;
font-size:15px;
background:#fff;
color:#25352c;
}

.agreement-box{
margin-top:18px;
background:#f5f8f6;
padding:18px;
border-radius:12px;
}

.agree{
display:flex;
align-items:flex-start;
gap:9px;
padding:9px 0;
font-size:14px;
}

.agree input{
width:auto;
margin-top:3px;
}

.agree label{
margin:0;
line-height:1.5;
}

.agree-all{
padding-bottom:14px;
margin-bottom:6px;
border-bottom:1px solid #dce5df;
}

button{
width:100%;
height:55px;
margin-top:28px;
border:0;
border-radius:12px;
background:#176b42;
color:#fff;
font-size:17px;
font-weight:600;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.notice{
margin-top:20px;
padding:18px;
background:#f0f5f1;
border-radius:12px;
font-size:13px;
line-height:1.6;
color:#657269;
}

footer{
text-align:center;
padding:30px;
font-size:12px;
color:#78857d;
}

@media(max-width:600px){

.header{
height:68px;
padding:0 18px;
}

.logo img{
width:170px;
}

.container{
margin:25px auto;
}

.card{
padding:25px 18px;
}

h1{
font-size:34px;
}

.form-grid,
.benefits{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

}

</style>
</head>

<body>

<header class="header">

<a class="logo" href="index.html">

<img
src="images/NCC_header_logo.png"
alt="전국소비자클럽 공식 로고">

</a>

</header>

<div class="container">

<div class="card">

<p class="eyebrow">
FREE MEMBERSHIP
</p>

<h1>
전국소비자클럽<br>
<span>무료 회원가입</span>
</h1>

<p class="subtitle">
가입비 0원.<br>
회원이 되면 상품 무료 경험, 공동구매,
회원 할인, 지역 혜택을 만나보실 수 있습니다.
</p>

<div class="benefits">

<div class="benefit">🎁 상품 무료 경험</div>
<div class="benefit">🛒 공동구매 혜택</div>
<div class="benefit">💰 회원 할인</div>
<div class="benefit">🏪 지역 혜택</div>

</div>


<form id="memberForm">

<div class="section">

<h2>기본정보</h2>

<div class="form-grid">

<div class="form-group">
<label for="name">이름 *</label>
<input id="name" type="text" required>
</div>

<div class="form-group">
<label for="phone">연락처 *</label>
<input
id="phone"
type="tel"
placeholder="010-0000-0000"
required>
</div>

<div class="form-group">
<label for="email">이메일</label>
<input id="email" type="email">
</div>

<div class="form-group">
<label for="birthDate">생년월일</label>
<input id="birthDate" type="date">
</div>

<div class="form-group">
<label for="gender">성별</label>

<select id="gender">
<option value="">선택</option>
<option value="male">남성</option>
<option value="female">여성</option>
</select>

</div>

<div class="form-group full">

<label for="region">
거주지역 / 주소 *
</label>

<input
id="region"
type="text"
placeholder="예: 서울특별시 강남구 삼성동"
required>

</div>

</div>
</div>


<div class="section">

<h2>관심정보</h2>

<div class="form-grid">

<div class="form-group">

<label for="benefit">
관심 혜택
</label>

<select id="benefit">

<option value="전체 혜택">
전체 혜택
</option>

<option value="상품 무료 경험">
상품 무료 경험
</option>

<option value="공동구매">
공동구매
</option>

<option value="회원 할인">
회원 할인
</option>

<option value="지역 혜택">
지역 혜택
</option>

</select>

</div>


<div class="form-group">

<label for="hasPet">
반려동물 보유 여부
</label>

<select id="hasPet">

<option value="">
선택
</option>

<option value="yes">
보유
</option>

<option value="no">
미보유
</option>

</select>

</div>

</div>
</div>


<div class="section">

<h2>추천 · 지역센터 정보</h2>

<div class="form-grid">

<div class="form-group">

<label for="referrer">
추천인
</label>

<input
id="referrer"
type="text">

</div>


<div class="form-group">

<label for="referralCode">
추천코드
</label>

<input
id="referralCode"
type="text">

</div>


<div class="form-group">

<label for="centerName">
소속센터
</label>

<input
id="centerName"
type="text"
placeholder="예: 서울특별시 강남구 삼성동 소비자센터">

</div>


<div class="form-group">

<label for="centerCode">
센터코드
</label>

<input
id="centerCode"
type="text">

</div>

</div>
</div>


<div class="section">

<h2>약관 및 개인정보 동의</h2>

<div class="agreement-box">


<div class="agree agree-all">

<input
id="agreeAll"
type="checkbox">

<label for="agreeAll">
전체 동의
</label>

</div>


<div class="agree">

<input
id="agreePrivacy"
class="agreeItem"
type="checkbox"
required>

<label for="agreePrivacy">
[필수] 개인정보 수집 및 이용 동의
</label>

</div>


<div class="agree">

<input
id="agreeMarketing"
class="agreeItem"
type="checkbox">

<label for="agreeMarketing">
[선택] 마케팅 정보 수신 동의
</label>

</div>


<div class="agree">

<input
id="agreeThirdParty"
class="agreeItem"
type="checkbox">

<label for="agreeThirdParty">
[선택] 개인정보 제3자 제공 동의
</label>

</div>


</div>
</div>


<button
id="submitButton"
type="submit">

무료 회원가입 신청

</button>

</form>


<div class="notice">

회원가입 완료 시
NCC 고유 회원번호가 자동 발급됩니다.

</div>

</div>
</div>


<footer>

전국소비자클럽 NCC<br>
소비자에게 더 많은 혜택을

</footer>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,
collection,
doc,
runTransaction,
serverTimestamp

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBHL7qCPUwcp9Vp_1dYWfCk2qBvRgJ9mcM",

authDomain:
"ncc-member.firebaseapp.com",

projectId:
"ncc-member",

storageBucket:
"ncc-member.firebasestorage.app",

messagingSenderId:
"772423138834",

appId:
"1:772423138834:web:753b6d6dc6f394904822cb",

measurementId:
"G-2YR29B054J"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


const form =
document.getElementById("memberForm");

const submitButton =
document.getElementById("submitButton");

const agreeAll =
document.getElementById("agreeAll");

const agreeItems =
document.querySelectorAll(".agreeItem");


agreeAll.addEventListener(
"change",
()=>{

agreeItems.forEach(
item=>{
item.checked =
agreeAll.checked;
}
);

}
);


agreeItems.forEach(
item=>{

item.addEventListener(
"change",
()=>{

const checked =
Array.from(agreeItems)
.every(
checkbox=>checkbox.checked
);

agreeAll.checked =
checked;

}
);

}
);


function createMemberNumber(number){

return (
"NCC-C-" +
String(number).padStart(6,"0")
);

}


async function saveMember(memberData){

const counterRef =
doc(
db,
"counters",
"memberNumbers"
);

const memberRef =
doc(
collection(
db,
"members"
)
);


return await runTransaction(
db,
async(transaction)=>{

const counterSnapshot =
await transaction.get(
counterRef
);

let currentNumber = 0;


if(
counterSnapshot.exists()
){

currentNumber =
Number(
counterSnapshot
.data()
.consumer || 0
);

}


const nextNumber =
currentNumber + 1;


const memberNumber =
createMemberNumber(
nextNumber
);


transaction.set(
counterRef,
{
consumer:
nextNumber
},
{
merge:true
}
);


transaction.set(
memberRef,
{

...memberData,

memberNumber:
memberNumber,

memberType:
"consumer",

status:
"active",

managementGrade:
"general",

adminMemo:
"",

joinDate:
serverTimestamp(),

updatedAt:
serverTimestamp()

}
);


return memberNumber;

}
);

}


form.addEventListener(
"submit",
async(event)=>{

event.preventDefault();


const agreePrivacy =
document
.getElementById(
"agreePrivacy"
)
.checked;


if(
!agreePrivacy
){

alert(
"개인정보 수집 및 이용에 동의해주세요."
);

return;

}


submitButton.disabled =
true;

submitButton.textContent =
"회원번호 발급 중...";


try{


const memberData = {

name:
document
.getElementById("name")
.value
.trim(),

phone:
document
.getElementById("phone")
.value
.trim(),

region:
document
.getElementById("region")
.value
.trim(),

email:
document
.getElementById("email")
.value
.trim(),

birthDate:
document
.getElementById("birthDate")
.value,

gender:
document
.getElementById("gender")
.value,

benefit:
document
.getElementById("benefit")
.value,

hasPet:
document
.getElementById("hasPet")
.value,

referrer:
document
.getElementById("referrer")
.value
.trim(),

referralCode:
document
.getElementById("referralCode")
.value
.trim(),

centerName:
document
.getElementById("centerName")
.value
.trim(),

centerCode:
document
.getElementById("centerCode")
.value
.trim(),

agreePrivacy:
true,

agreeMarketing:
document
.getElementById(
"agreeMarketing"
)
.checked,

agreeThirdParty:
document
.getElementById(
"agreeThirdParty"
)
.checked

};


const memberNumber =
await saveMember(
memberData
);


alert(
"전국소비자클럽 회원가입이 완료되었습니다.\n\n" +
"회원번호: " +
memberNumber
);


window.location.href =
"index.html";


}catch(error){


console.error(
error
);


alert(
"회원가입 저장 중 오류가 발생했습니다.\n\n" +
error.message
);


submitButton.disabled =
false;

submitButton.textContent =
"무료 회원가입 신청";


}

}
);

</script>

</body>
</html>
