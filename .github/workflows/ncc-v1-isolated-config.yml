    paths: [.github/workflows/ncc-v1-isolated-config.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ncc-v1-isolated-config-260905
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
