<style>

:root{
--green:#176b42;
--deep:#0d3b29;
--gold:#b89542;
--light:#f4f8f5;
--line:#dfe8e2;
--text:#13251b;
--sub:#68766e;
}


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Apple SD Gothic Neo",
"Malgun Gothic",
Arial,
sans-serif;

color:var(--text);

background:#fff;

letter-spacing:-0.04em;

}


img{

max-width:100%;

display:block;

}


a{

text-decoration:none;

color:inherit;

}



.wrap{

width:min(1180px,calc(100% - 40px));

margin:auto;

}



/* =====================
HEADER
===================== */


.header{

height:96px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;

background:#fff;

border-bottom:1px solid #edf1ee;

position:sticky;

top:0;

z-index:3000;

}



.brand{

display:flex;

align-items:center;

width:240px;

}



.brand img{

height:62px;

width:auto;

object-fit:contain;

}



.header-nav{

display:flex;

align-items:center;

gap:25px;

}



.nav-link{

font-size:15px;

font-weight:800;

}



.nav-join{

background:var(--green);

color:#fff;

padding:12px 20px;

border-radius:12px;

font-weight:900;

}



.menu{

display:none;

border:0;

background:#f4f8f5;

font-size:25px;

border-radius:10px;

width:42px;

height:42px;

}



/* =====================
HERO
===================== */


.hero{

padding:70px 0;

background:

linear-gradient(
135deg,
#fbfdfb,
#eaf4ed
);

}



.hero-inner{

display:grid;

grid-template-columns:1fr 1fr;

gap:60px;

align-items:center;

}



.hero h1{

font-size:68px;

line-height:1.05;

margin:0 0 25px;

}



.hero h1 span{

color:var(--green);

}



.hero-desc{

font-size:18px;

line-height:1.7;

color:var(--sub);

}



.hero-buttons{

display:flex;

gap:12px;

margin-top:30px;

}



.btn{

display:flex;

align-items:center;

justify-content:center;

height:54px;

padding:0 28px;

border-radius:12px;

background:var(--green);

color:#fff;

font-weight:900;

}



.btn.white{

background:#fff;

color:var(--green);

border:1px solid #c9ddd0;

}



.hero-image img{

height:430px;

width:100%;

object-fit:cover;

border-radius:28px;

}



/* =====================
BENEFIT
===================== */


.section{

padding:70px 0;

}



.section-title{

text-align:center;

margin-bottom:40px;

}



.section-title h2{

font-size:38px;

margin:0 0 10px;

}



.section-title p{

color:var(--sub);

}



.card-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:18px;

}



.card{

padding:25px;

border:1px solid var(--line);

border-radius:20px;

background:#fff;

}



.card strong{

font-size:18px;

display:block;

margin-bottom:10px;

}



.card p{

font-size:14px;

color:var(--sub);

}

@media(max-width:768px){

.header{
height:72px;
padding:0 20px;
}

.brand img{
height:45px;
}


.header-nav{
display:none;
}


.menu{
display:block;
}


.hero{
padding:40px 0;
}


.hero-inner{

display:flex;
flex-direction:column;

gap:30px;

}


.hero h1{

font-size:42px;
line-height:1.15;

}


.hero-desc{

font-size:15px;

}


.hero-image img{

height:260px;

}


.hero-buttons{

width:100%;

}


.btn{

flex:1;
padding:0 10px;

}

}

</style>
