<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공동구매 상세 | 전국소비자클럽</title><link rel="stylesheet" href="css/platform.css"><link rel="stylesheet" href="css/groupbuy.css"></head><body data-page="groupbuy"><main id="mainContent" class="platform-main"><section class="platform-section paper"><div id="productLoading" class="empty-state">상품 정보를 불러오는 중입니다.</div><article class="product-detail" id="productDetail" hidden><div class="product-detail-visual"><img id="productImage" alt="공동구매 상품"></div><div class="product-detail-copy"><span class="badge" id="productBadge"></span><h1 id="productTitle"></h1><p class="description" id="productDescription"></p><div class="product-price"><b id="productPrice"></b><del id="regularPrice"></del></div><div class="detail-list"><div><span>모집기간</span><b id="productPeriod"></b></div><div><span>목표인원</span><b id="productTarget"></b></div><div><span>배송안내</span><b id="productShipping"></b></div><div><span>공급 파트너</span><b id="productSupplier"></b></div></div><a class="ncc-button gold" href="#orderForm">공동구매 참여하기</a></div></article></section><section class="platform-section"><div class="section-head"><div><p class="eyebrow">PARTICIPATION</p><h2>공동구매 참여 신청</h2><p>신청 접수 후 모집 확정·결제·배송 방법을 담당자가 안내합니다. 이 화면에서 즉시 결제되지 않습니다.</p></div></div><div class="form-panel"><form id="orderForm" class="form-grid"><div class="field"><label>이름 *</label><input name="name" maxlength="50" required></div><div class="field"><label>연락처 *</label><input name="phone" inputmode="tel" maxlength="30" required placeholder="010-0000-0000"></div><div class="field"><label>참여 수량 *</label><input name="quantity" type="number" min="1" max="20" value="1" required></div><div class="field"><label>지역 *</label><input name="region" maxlength="100" required placeholder="예) 서울 강남구"></div><div class="field wide"><label>배송 주소 *</label><input name="address" maxlength="300" required placeholder="상세 주소까지 입력해 주세요"></div><div class="field wide"><label>요청사항</label><textarea name="message" maxlength="500" rows="4"></textarea></div><div class="field wide"><label><span><input name="agree" type="checkbox" required> 공동구매 참여 안내 및 신청정보 처리에 동의합니다.</span></label></div><div class="wide"><p id="orderMessage" role="status" aria-live="polite"></p><button class="ncc-button gold" id="orderButton" type="submit">참여 신청 접수</button></div></form><div class="order-result" id="orderResult" hidden></div></div></section></main><script src="js/platform-shell.js"></script><script type="module" src="js/groupbuy-detail.js"></script></body></html>
