name: NCC V1 Read-Only Connectivity Check

on:
  push:
    branches:
      - audit/ncc-v1-readonly-20260905
    paths:
      - .github/workflows/ncc-v1-readonly-check.yml

permissions:
  contents: read

jobs:
  readonly-check:
    if: github.repository == 'kpa100plus-debug/ncc365-website'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read NCC service metadata without changing production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          node <<'NODE'
          const { createSign } = require('node:crypto');
          const fs = require('node:fs');
          const results = [];
          const add = (label, status, detail='') => results.push({label,status,detail});
          const timeout = () => AbortSignal.timeout(20000);
          async function jsonGet(url, bearer) {
            const u = new URL(url);
            const allowed = u.protocol === 'https:' && (
              (u.hostname === 'api.cloudflare.com' && u.pathname.startsWith('/client/v4/')) ||
              (u.hostname === 'firestore.googleapis.com' && u.pathname === '/v1/projects/ncc-member/databases/(default)') ||
              (u.hostname === 'identitytoolkit.googleapis.com' && u.pathname === '/admin/v2/projects/ncc-member/config')
            );
            if (!allowed || u.username || u.password) throw new Error('REQUEST_NOT_ALLOWED');
            const r = await fetch(u, {method:'GET', headers:{Authorization:'Bearer '+bearer}, redirect:'error', signal:timeout()});
            let body; try {body=await r.json();} catch {}
            return {ok:r.ok, status:r.status, body};
          }
          async function cf() {
            const token=process.env.CLOUDFLARE_API_TOKEN;
            const account=process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!token || !account) {add('Cloudflare credentials','MISSING');return;}
            if (!/^[a-f0-9]{32}$/i.test(account)) {add('Cloudflare account format','INVALID');return;}
            for (const [label,path] of [
              ['Cloudflare token verification','/user/tokens/verify'],
              ['NCC Pages project read','/accounts/'+account+'/pages/projects/ncc365-website']
            ]) {
              try {
                const r=await jsonGet('https://api.cloudflare.com/client/v4'+path,token);
                add(label,r.ok && r.body?.success ? 'PASS':'FAIL','HTTP '+r.status);
              } catch {add(label,'ERROR','No response body logged');}
            }
            try {
              const z=await jsonGet('https://api.cloudflare.com/client/v4/zones?name=ncc365.com&per_page=50',token);
              if (!z.ok || !z.body?.success) {add('NCC zone read','FAIL','HTTP '+z.status);return;}
              const zone=z.body.result?.find(x=>x.name==='ncc365.com' && x.account?.id===account);
              if (!zone || !/^[a-f0-9]{32}$/i.test(zone.id)) {add('NCC zone read','NOT_FOUND');return;}
              add('NCC zone read','PASS');
              for (const [label,path] of [['NCC DNS read','dns_records?per_page=1'],['NCC zone settings read','settings']]) {
                try {
                  const r=await jsonGet('https://api.cloudflare.com/client/v4/zones/'+zone.id+'/'+path,token);
                  add(label,r.ok && r.body?.success?'PASS':'FAIL','HTTP '+r.status);
                } catch {add(label,'ERROR','No response body logged');}
              }
            } catch {add('NCC zone read','ERROR','No response body logged');}
          }
          async function google() {
            let sa;
            try {sa=JSON.parse(process.env.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON||'');}
            catch {add('Firebase service account','INVALID_OR_MISSING');return;}
            if (sa.project_id!=='ncc-member' || typeof sa.client_email!=='string' || !sa.client_email.endsWith('.iam.gserviceaccount.com') || typeof sa.private_key!=='string') {
              add('Firebase project guard','FAIL');return;
            }
            let token;
            try {
              const now=Math.floor(Date.now()/1000);
              const b64 = obj => Buffer.from(JSON.stringify(obj)).toString('base64url');
              const head=b64({alg:'RS256',typ:'JWT'});
              const body=b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+600});
              const input=head+'.'+body;
              const sig=createSign('RSA-SHA256').update(input).sign(sa.private_key,'base64url');
              const response=await fetch('https://oauth2.googleapis.com/token',{method:'POST',redirect:'error',signal:timeout(),headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:input+'.'+sig})});
              const data=await response.json();
              if (!response.ok || typeof data.access_token!=='string') {add('Firebase authentication','FAIL','HTTP '+response.status);return;}
              token=data.access_token; add('Firebase authentication','PASS');
            } catch {add('Firebase authentication','ERROR','No credential or response body logged');return;}
            for (const [label,url] of [
              ['NCC Firestore database metadata read','https://firestore.googleapis.com/v1/projects/ncc-member/databases/(default)'],
              ['NCC Authentication configuration read','https://identitytoolkit.googleapis.com/admin/v2/projects/ncc-member/config']
            ]) {
              try {
                const r=await jsonGet(url,token);
                add(label,r.ok?'PASS':'FAIL','HTTP '+r.status);
              } catch {add(label,'ERROR','No response body logged');}
            }
          }
          (async()=>{
            await cf(); await google();
            const report={reference:'REF-NCC-V1-READONLY-PROBE-20260905-01',checkedAt:new Date().toISOString(),backupCreated:false,productionWrites:false,results};
            console.log(JSON.stringify(report,null,2));
            const lines=['## NCC V1 read-only connectivity check','','No member records, passwords, tokens, or remote response bodies are logged. This is not a data backup.','','| Check | Result | Detail |','|---|---|---|',...results.map(r=>'| '+r.label+' | '+r.status+' | '+r.detail+' |')];
            if(process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
            if (results.some(r=>r.status!=='PASS')) process.exitCode=1;
          })().catch(()=>{console.error('Read-only probe failed. Sensitive error details suppressed.');process.exitCode=1;});
          NODE
