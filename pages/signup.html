<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NCC 소비자회원 가입</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<section class="signup">


<h1>
전국소비자클럽<br>
소비자회원 가입
</h1>


<p>
가입비 0원<br>
무료 가입 후 다양한 소비 혜택을 만나보세요.
</p>



<form>


<h2>01 기본정보</h2>


<input type="text" placeholder="이름">

<br>

<select>
<option>성별 선택</option>
<option>남성</option>
<option>여성</option>
</select>


<br>


<input type="date">


<br>


<input type="tel" placeholder="휴대폰 번호">


<br>


<input type="email" placeholder="이메일">


<br>


<input type="text" placeholder="주소">


<br><br>



<h2>02 소비 관심정보</h2>


<select>
<option>관심 분야 선택</option>
<option>식품</option>
<option>생활용품</option>
<option>건강</option>
<option>뷰티</option>
<option>여행</option>
<option>지역 혜택</option>
</select>



<br>


<textarea placeholder="원하는 소비 혜택 또는 관심 내용을 입력하세요"></textarea>




<h2>03 추천정보</h2>


<input type="text" placeholder="추천인 이름">

<br>

<input type="text" placeholder="추천코드">


<br><br>


<h2>04 동의</h2>


<label>
<input type="checkbox">
개인정보 수집 및 이용 동의
</label>

<br>


<label>
<input type="checkbox">
마케팅 정보 수신 동의
</label>


<br>


<label>
<input type="checkbox">
제3자 정보 제공 동의
</label>


<br><br>


<button type="submit">
소비자회원 가입 신청
</button>



</form>


</section>



</body>

</html>
