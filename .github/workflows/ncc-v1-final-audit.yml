          const {spawnSync} = require('node:child_process');
          const TARGET = 'ncc-v1-restore-kpa-260905';
          const REPO = 'kpa100plus-debug/ncc365-website';
          const ARTIFACT = 9964069253;
          const ZIP_HASH = '38a973160e8446cf8a9c5bd0e0016f5c56820f5778c9a5bf45babecc781ea07d';
          const TAR_HASH = '287c1c0cb872960a8194b2fdbc2e113d7f8ecd7d7cd2f9bbede49db0ed491865';
          const DB = `projects/${TARGET}/databases/(default)`;
          const DOCS = `https://firestore.googleapis.com/v1/${DB}/documents`;
