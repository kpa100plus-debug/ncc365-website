name: Revenue deployment routing audit
on:
  push:
    branches: [work/revenue-microsites-20260908]
    paths: [.github/workflows/revenue-routing-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect project routing without changing configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'JS'
          const token=process.env.CF_TOKEN,account=process.env.CF_ACCOUNT;
          if(!token||!account)throw Error('Existing Cloudflare credentials unavailable');
          fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects',{
            headers:{Authorization:'Bearer '+token}
          }).then(async r=>{
            if(!r.ok)throw Error('Cloudflare project read HTTP '+r.status);
            const p=await r.json();if(p.success===false)throw Error('Cloudflare project read failed');
            for(const x of p.result||[]){
              if(!['ncc365-website','daily-fortune-now','arcana-day'].includes(x.name))continue;
              const c=x.source?.config||{};
              console.log(JSON.stringify({project:x.name,production_branch:x.production_branch,
                source_type:x.source?.type,repository:c.repo_name,
                production_deployments_enabled:c.production_deployments_enabled,
                production_branch:c.production_branch||x.production_branch,
                path_includes:c.path_includes,path_excludes:c.path_excludes,
                preview_deployment_setting:c.preview_deployment_setting,
                production_deployment:x.canonical_deployment?.id,
                production_commit:x.canonical_deployment?.deployment_trigger?.metadata?.commit_hash}));
            }
          }).catch(e=>{console.error(e.message);process.exitCode=1});
          JS
