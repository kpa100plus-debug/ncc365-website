permissions:
  contents: read
  actions: read
concurrency:
  group: ncc-v1-final-audit-260906
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit backup and isolated resources without restore writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          umask 077
          cat > runner-key-seal.json <<'NCC_SEAL'
          {"meta":{"format":"NCC-RESTORE-RUNNER-KEY-SEAL-v1","repository":"kpa100plus-debug/ncc365-website","target":"ncc-v1-restore-kpa-260905","artifactId":9964069253,"artifactSha256":"38a973160e8446cf8a9c5bd0e0016f5c56820f5778c9a5bf45babecc781ea07d","expiresAt":"2026-09-06T08:00:00Z"},"aad":"{\"format\":\"NCC-RESTORE-RUNNER-KEY-SEAL-v1\",\"repository\":\"kpa100plus-debug/ncc365-website\",\"target\":\"ncc-v1-restore-kpa-260905\",\"artifactId\":9964069253,\"artifactSha256\":\"38a973160e8446cf8a9c5bd0e0016f5c56820f5778c9a5bf45babecc781ea07d\",\"expiresAt\":\"2026-09-06T08:00:00Z\"}","iv":"bpOZu6lUxLl1fpww","tag":"yfknZkeVkFYg+czZSOJfEw==","ciphertext":"","wrappedKeys":{"0fcb8909b32192ce39f4e783743e5fff44f8b33d":"","bf6ecd20a3b5b165ad8bfe3a47b5c0a0c01df89c":"","0cb6441464f31b689b7fd2fb9e10a002829480e4":"","faccccc65a9cf13c7e728ae83079fe618adf0624":""}}
          NCC_SEAL
          cat > restore.cjs <<'NCC_SCRIPT'
          'use strict';
          // Isolated restore only. No production resource requests or writes.
