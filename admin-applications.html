<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NCC 혜택 신청관리</title>
  <link rel="stylesheet" href="css/admin-applications.css?v=20260829-2">
</head>
<body>
<main class="admin-shell">
  <section class="login-panel" id="loginArea">
    <img src="images/NCC_HEADER.webp?v=20260826-1" alt="전국소비자클럽">
    <p>NCC ADMINISTRATION</p>
    <h1>혜택 신청관리</h1>
    <input id="adminEmail" aria-label="관리자 이메일" type="email" autocomplete="username" placeholder="관리자 이메일">
    <input id="adminPassword" aria-label="관리자 비밀번호" type="password" autocomplete="current-password" placeholder="비밀번호">
    <button id="loginButton">관리자 로그인</button>
    <p class="error" id="loginError"></p>
    <a href="index.html">← 홈페이지로 돌아가기</a>
  </section>

  <section id="adminArea" hidden>
    <header class="admin-head">
      <div>
        <p>NCC ADMINISTRATION</p>
        <h1>혜택·서비스 신청관리</h1>
        <span>홈페이지에서 접수된 신청을 확인하고 진행상태와 월렛 알림을 함께 관리합니다.</span>
      </div>
      <div><a href="admin.html">통합관리</a><a href="admin-members.html">회원관리</a><button id="logoutButton">로그아웃</button></div>
    </header>

    <div class="notification-guide">
      <b>NCC 월렛 자동 알림</b>
      <span>확인중·연락완료·승인·보류로 저장하면 해당 회원의 월렛 알림함에 자동 표시됩니다.</span>
      <small>모집 알림 신청은 실제 모집을 시작할 때만 ‘승인’으로 저장하세요. 이메일·문자 발송은 별도 발송 작업을 한 경우에만 전달됩니다.</small>
    </div>
    <p id="adminStatusMessage" class="admin-status" role="status" aria-live="polite"></p>

    <div class="stats">
      <article><span>전체 신청</span><b id="totalCount">0</b></article>
      <article><span>신규</span><b id="newCount">0</b></article>
      <article><span>처리중</span><b id="progressCount">0</b></article>
      <article><span>완료</span><b id="doneCount">0</b></article>
    </div>
    <div class="toolbar">
      <select id="statusFilter" aria-label="상태 필터"><option value="all">전체 상태</option><option value="new">신규</option><option value="checking">확인중</option><option value="contacted">연락완료</option><option value="approved">승인</option><option value="hold">보류</option></select>
      <input id="searchInput" aria-label="검색" placeholder="이름·연락처·지역·접수번호 검색">
      <button id="refreshButton">새로고침</button>
    </div>
    <div id="applicationList" class="application-list"></div>
  </section>
</main>
<script type="module" src="js/admin-applications.js?v=20260829-2"></script>
</body>
</html>
