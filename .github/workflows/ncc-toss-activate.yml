name: NCC Toss Payments Activate

on:
  workflow_dispatch:
    inputs:
      target:
        description: "disabled = 즉시 잠금, test = 토스 테스트키, live = 운영키"
        required: true
        type: choice
        default: test
        options:
          - disabled
          - test
          - live
      live_confirmation:
        description: "live에만 NCC-TOSS-LIVE-CONFIRMED 입력"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ncc-toss-payments-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Validate, configure, redeploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOSS_TARGET: ${{ inputs.target }}
      TOSS_CLIENT_KEY: ${{ inputs.target == 'live' && secrets.TOSS_LIVE_CLIENT_KEY || secrets.TOSS_TEST_CLIENT_KEY }}
      TOSS_SECRET_KEY: ${{ inputs.target == 'live' && secrets.TOSS_LIVE_SECRET_KEY || secrets.TOSS_TEST_SECRET_KEY }}
      TOSS_LIVE_CONFIRMATION: ${{ inputs.live_confirmation }}
      PAYMENT_TESTER_EMAILS: ${{ secrets.NCC_E2E_D_EMAIL }}
      NCC_D1_DATABASE_NAME: ncc-test-payments
      WRANGLER_VERSION: 4.126.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate protected inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare GitHub Actions secrets are missing."
            exit 1
          fi
          if [ "$TOSS_TARGET" != "disabled" ] && { [ -z "$TOSS_CLIENT_KEY" ] || [ -z "$TOSS_SECRET_KEY" ]; }; then
            echo "::error::The selected Toss Payments key pair is missing."
            exit 1
          fi
          if [ "$TOSS_TARGET" = "test" ] && [ -z "$PAYMENT_TESTER_EMAILS" ]; then
            echo "::error::The protected Toss tester email is missing."
            exit 1
          fi
          if [ "$TOSS_TARGET" = "live" ] && [ "$TOSS_LIVE_CONFIRMATION" != "NCC-TOSS-LIVE-CONFIRMED" ]; then
            echo "::error::Live activation confirmation does not match."
            exit 1
          fi

      - name: Install pinned Cloudflare CLI
        run: npm install --global "wrangler@${WRANGLER_VERSION}"

      - name: Verify additive Toss payment schema
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --file migrations/0001_ncc_test_payments.sql --yes > /dev/null
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --file migrations/0003_ncc_toss_payment_readiness.sql --yes > /dev/null
          schema_file="${RUNNER_TEMP}/ncc-toss-schema.json"
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --command "SELECT name FROM sqlite_schema WHERE type='table' AND name IN ('payments','payment_events','payment_provider_transactions','payment_provider_events') ORDER BY name" --json > "$schema_file"
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const rows=new Set(data.flatMap(x=>x.results||[]).map(x=>x.name));for(const name of ["payments","payment_events","payment_provider_transactions","payment_provider_events"]){if(!rows.has(name))throw new Error(`D1 Toss schema verification failed: ${name}`)}' "$schema_file"

      - name: Apply guarded Toss Payments configuration
        run: node .github/scripts/configure-ncc-toss-pages.mjs
