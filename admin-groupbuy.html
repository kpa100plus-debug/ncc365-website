<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCC 공동구매 관리</title><link rel="stylesheet" href="css/admin-applications.css?v=20260830-1"><link rel="stylesheet" href="css/groupbuy.css?v=20260830-1"></head><body><main class="admin-shell"><section class="login-panel" id="loginArea"><img src="images/NCC_HEADER.webp?v=20260826-1" alt="전국소비자클럽"><p>NCC ADMINISTRATION</p><h1>공동구매 관리</h1><input id="adminEmail" aria-label="관리자 이메일" type="email" autocomplete="username" placeholder="관리자 이메일"><input id="adminPassword" aria-label="관리자 비밀번호" type="password" autocomplete="current-password" placeholder="비밀번호"><button id="loginButton">관리자 로그인</button><p class="error" id="loginError"></p><a href="admin.html">← 통합 관리자로 돌아가기</a></section><section id="adminArea" hidden><header class="admin-head"><div><p>NCC ADMINISTRATION</p><h1>공동구매 상품·주문관리</h1><span>상품을 등록·공개하고 주문확정 → 결제확인 → 배송중 → 완료 상태와 회원 안내정보를 관리합니다.</span></div><div><a href="admin.html">통합관리</a><button id="logoutButton">로그아웃</button></div></header><div class="stats"><article><span>등록 상품</span><b id="productCount">0</b></article><article><span>공개 상품</span><b id="publishedCount">0</b></article><article><span>전체 주문</span><b id="orderCount">0</b></article><article><span>신규 주문</span><b id="newOrderCount">0</b></article></div><div class="admin-tabs"><button class="active" data-tab="products">상품관리</button><button data-tab="orders">참여·주문관리</button></div><section id="productsPanel"><button id="newProductButton">+ 새 상품 등록</button><form id="productForm" class="admin-form" hidden><input type="hidden" name="productId"><div class="admin-form-grid"><label>상품명 *<input name="title" maxlength="120" required></label><label>카테고리 *<input name="category" maxlength="80" required placeholder="예: 건강식품"></label><label class="wide">한 줄 소개<input name="subtitle" maxlength="200"></label><label>판매가격(원) *<input name="price" type="number" min="0" required></label><label>정상가격(원)<input name="regularPrice" type="number" min="0"></label><label>목표 인원 *<input name="minParticipants" type="number" min="1" required></label><label>재고수량<input name="stock" type="number" min="0"></label><label>모집 시작일<input name="startDate" type="date"></label><label>모집 종료일<input name="endDate" type="date"></label><label>진행상태<select name="status"><option value="draft">준비중</option><option value="recruiting">모집중</option><option value="confirmed">진행확정</option><option value="closed">마감</option></select></label><label>공개여부<select name="published"><option value="false">비공개</option><option value="true">공개</option></select></label><label class="wide">상품 이미지 URL<input name="image" maxlength="500" placeholder="images/NCC_consumer.jpg"></label><label>공급 파트너<input name="supplier" maxlength="120"></label><label>배송안내<input name="shipping" maxlength="200"></label><label class="wide">상세설명 *<textarea name="description" maxlength="2000" rows="5" required></textarea></label></div><button type="submit">상품 저장</button> <button type="button" id="cancelProductButton">취소</button><p id="productMessage"></p></form><div id="productList" class="application-list"></div></section><section id="ordersPanel" hidden><div class="toolbar"><select id="orderStatusFilter" aria-label="주문상태 필터"><option value="all">전체 상태</option><option value="new">신규</option><option value="checking">확인중</option><option value="confirmed">주문확정</option><option value="paid">결제확인</option><option value="shipping">배송중</option><option value="completed">완료</option><option value="cancelled">취소</option></select><input id="orderSearch" aria-label="주문 검색" placeholder="상품·이름·연락처·접수번호 검색"><button id="refreshButton">새로고침</button></div><div id="orderList" class="application-list"></div></section></section></main><script type="module" src="js/admin-groupbuy.js?v=20260825-1"></script></body></html>
