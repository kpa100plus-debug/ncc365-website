<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCC 전국소비자센터 신청</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<section class="center">

<h1>
전국소비자센터<br>
센터장·팀원 신청
</h1>

<p>
지역 소비자와 기업을 연결하는<br>
NCC 전국 네트워크에 함께하세요.
</p>


<form>

<h2>01 신청자 정보</h2>

<input type="text" placeholder="성명">

<br>

<input type="tel" placeholder="휴대폰 번호">

<br>

<input type="text" placeholder="거주 지역 (시·군·구)">

<br>

<input type="email" placeholder="이메일">


<h2>02 신청 구분</h2>

<select>
<option>신청 유형 선택</option>
<option>센터장</option>
<option>팀원</option>
</select>


<h2>03 운영 희망지역</h2>

<input type="text" placeholder="희망 운영 지역">


<h2>04 활동 경험</h2>

<textarea placeholder="영업·마케팅·지역활동 경험"></textarea>


<h2>05 확인 및 동의</h2>

<label>
<input type="checkbox">
NCC 운영 기준 및 개인정보 활용에 동의합니다.
</label>


<br><br>

<button type="submit">
센터 참여 신청
</button>


</form>

</section>

</body>
</html>
