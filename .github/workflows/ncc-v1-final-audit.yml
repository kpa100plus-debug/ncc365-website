           await test('firestore_default_field_configuration',async()=>{const data=[];for(const project of ['ncc-member',TARGET])data.push((await req('https://firestore.googleapis.com/v1/projects/'+project+'/databases/(default)/collectionGroups/__default__/fields/*')).data);captured.defaultField={source:data[0],target:data[1]};record('firestore_default_field_configuration',equal(norm(data[0]),norm(data[1]))?'PASS':'FAIL',{currentLiveComparison:true});});
