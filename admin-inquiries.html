<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCC 파트너·센터 접수관리</title><link rel="stylesheet" href="css/admin-applications.css"></head><body><main class="admin-shell"><section class="login-panel" id="loginArea"><img src="images/NCC_HEADER.webp?v=20260826-1" alt="전국소비자클럽"><p>NCC ADMINISTRATION</p><h1>파트너·센터 접수관리</h1><input id="adminEmail" aria-label="관리자 이메일" type="email" autocomplete="username" placeholder="관리자 이메일"><input id="adminPassword" aria-label="관리자 비밀번호" type="password" autocomplete="current-password" placeholder="비밀번호"><button id="loginButton">관리자 로그인</button><p class="error" id="loginError"></p><a href="admin.html">← 통합 관리자로 돌아가기</a></section><section id="adminArea" hidden><header class="admin-head"><div><p>NCC ADMINISTRATION</p><h1>파트너·센터 접수관리</h1><span>홈페이지에서 접수된 제휴 및 센터 참여 신청을 관리합니다.</span></div><div><a href="admin.html">통합관리</a><button id="logoutButton">로그아웃</button></div></header><div class="stats"><article><span>전체 접수</span><b id="totalCount">0</b></article><article><span>신규</span><b id="newCount">0</b></article><article><span>처리중</span><b id="progressCount">0</b></article><article><span>승인</span><b id="doneCount">0</b></article></div><div class="toolbar"><select id="kindFilter" aria-label="접수 구분 필터"><option value="all">전체 구분</option><option value="partner">파트너 제휴</option><option value="center">센터 참여</option></select><select id="statusFilter" aria-label="상태 필터"><option value="all">전체 상태</option><option value="new">신규</option><option value="checking">확인중</option><option value="contacted">연락완료</option><option value="approved">승인</option><option value="hold">보류</option></select><input id="searchInput" aria-label="검색" placeholder="이름·연락처·지역·업체 검색"><button id="refreshButton">새로고침</button></div><div id="applicationList" class="application-list"></div></section></main><script type="module" src="js/admin-inquiries.js"></script></body></html>
