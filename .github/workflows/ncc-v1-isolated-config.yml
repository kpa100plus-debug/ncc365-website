          const report = {reference:'REF-NCC-V1-ENCRYPTED-BACKUP-20260905-01',target:TARGET,sourceProject:'ncc-member',productionWrites:false,startedAt:new Date().toISOString(),checks:[],limitations:['Cloudflare Pages/D1 runtime is not verified by this Firebase restore.','Google OAuth, email delivery, push and real-device behavior are not verified.','Production secret environment values and full IAM/SSL settings are outside the captured backup.','Firestore server create/update times are regenerated in the isolated project.']};
