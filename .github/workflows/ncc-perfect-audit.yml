name: NCC Perfect Website Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "재검증할 NCC URL"
        required: true
        default: "https://ncc365.com"
        type: string

permissions:
  contents: read

concurrency:
  group: ncc-perfect-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-responsive-audit:
    name: Source, font, accessibility, and responsive audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Check source quality
        run: npm run test:quality

      - name: Check Consumer ON reader regression
        run: npm run test:magazine

      - name: Install pinned browser runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render all NCC pages at required widths
        env:
          NCC_SERVE_DIR: .
          NCC_AUDIT_PHASE: source
          NCC_AUDIT_ENFORCE: "true"
          NCC_AUDIT_CONCURRENCY: "6"
        run: node .github/scripts/ncc-public-audit.mjs

      - name: Render protected member and administration screens
        env:
          NCC_SERVE_DIR: .
          NCC_AUDIT_OUTPUT: artifacts/protected-audit
          NCC_AUDIT_PHASE: protected
          NCC_AUDIT_STATE: protected
          NCC_AUDIT_ENFORCE: "true"
          NCC_AUDIT_CONCURRENCY: "6"
          NCC_AUDIT_ROUTES: /wallet.html,/profile.html,/center-dashboard.html,/partner-dashboard.html,/admin-applications.html,/admin-certificates.html,/admin-groupbuy.html,/admin-inquiries.html,/admin-payments.html,/admin-feedback.html,/admin-business-cards.html,/admin-members.html,/admin-accounts.html,/admin-operations.html,/admin-roles.html,/benefit-detail.html,/groupbuy-detail.html,/order-detail.html,/payment-checkout.html,/payment-result.html,/certificate-verify.html,/password-reset.html
        run: node .github/scripts/ncc-public-audit.mjs

      - name: Render protected interactive variants
        env:
          NCC_SERVE_DIR: .
          NCC_AUDIT_OUTPUT: artifacts/protected-variant-audit
          NCC_AUDIT_PHASE: protected-variants
          NCC_AUDIT_STATE: protected
          NCC_AUDIT_ENFORCE: "true"
          NCC_AUDIT_CONCURRENCY: "6"
          NCC_AUDIT_ROUTES: /wallet.html?__ncc_variant=back,/profile.html?__ncc_variant=address,/admin-business-cards.html?__ncc_variant=portrait,/admin-certificates.html?__ncc_variant=form,/admin-groupbuy.html?__ncc_variant=form,/admin-groupbuy.html?__ncc_variant=orders,/admin-members.html?__ncc_variant=member-modal,/admin-members.html?__ncc_variant=bulk-modal,/admin-accounts.html?__ncc_variant=recovery,/admin-accounts.html?__ncc_variant=restriction,/admin-accounts.html?__ncc_variant=log
        run: node .github/scripts/ncc-public-audit.mjs

      - name: Upload responsive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncc-source-responsive-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/public-audit
            artifacts/protected-audit
            artifacts/protected-variant-audit
          if-no-files-found: warn
          retention-days: 14

  production-reverification:
    name: Production deployment reverification
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Wait for Cloudflare Pages deployment
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          expected_deploy="$(tr -d '\r\n' < deploy-version.txt)"
          for attempt in $(seq 1 24); do
            deployed="$(curl --fail --silent --show-error "https://ncc365.com/deploy-version.txt?run=${GITHUB_RUN_ID}-${attempt}" | tr -d '\r\n' || true)"
            if [ "$deployed" = "$expected_deploy" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Cloudflare Pages did not expose the exact audited build within 6 minutes."
          exit 1

      - name: Install pinned browser runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Reverify deployed site
        env:
          NCC_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://ncc365.com' }}
          NCC_AUDIT_PHASE: production
          NCC_AUDIT_ENFORCE: "true"
        run: node .github/scripts/ncc-public-audit.mjs

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncc-production-responsive-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-audit
          if-no-files-found: warn
          retention-days: 14
