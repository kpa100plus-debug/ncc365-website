<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCC 공식 인증서</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0ec;color:#18294a;font-family:"Noto Serif KR","Malgun Myeongjo",serif}.tools{width:min(100%,210mm);margin:18px auto;display:flex;justify-content:flex-end}.tools button{border:0;border-radius:8px;background:#b78828;color:#fff;padding:12px 18px;font-weight:600;font-size:15px;cursor:pointer}.status{width:min(92vw,620px);margin:18vh auto;padding:36px;border-radius:20px;background:#fffdf8;box-shadow:0 14px 36px #10234b18;text-align:center}.status h1{margin:0 0 12px;font-size:25px}.status p{margin:0;line-height:1.7;color:#475569}
.certificate{width:210mm;height:297mm;margin:0 auto 18px;position:relative;overflow:hidden;background:#fffdf8;box-shadow:0 12px 30px #10234b24}.template{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.slot{position:absolute;z-index:1;color:#15264a;text-align:center;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recipient{left:25%;top:61.1%;width:50%;height:4.2%;padding:.55% 1%;background:#fffdf8;font-size:6.6mm;letter-spacing:.08em}.details{position:absolute;z-index:1;left:31%;top:67.05%;width:41%;display:grid;grid-template-columns:24mm 1fr;gap:.85mm 2.2mm;padding:1.1mm 2mm;background:#fffdf8;font-size:2.9mm;line-height:1.45}.details dt{margin:0;text-align:right;color:#51473d}.details dd{margin:0;text-align:left;border-bottom:.22mm solid #c9a452;color:#15264a;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.issued-at{left:34%;top:81.15%;width:32%;height:2.5%;padding:.25% 1%;background:#fffdf8;font-size:3.5mm}.certificate-number{left:8.2%;bottom:3.05%;width:34%;height:2%;text-align:left;font-family:Arial,sans-serif;font-size:2.45mm;letter-spacing:.02em;color:#262626}.qr-wrap{position:absolute;z-index:2;left:82.2%;top:84.25%;width:7.15%;aspect-ratio:1;padding:.65mm;background:#fff}.qr-wrap svg{display:block;width:100%;height:100%}
@media print{body{background:#fff}.tools,.status{display:none}.certificate{margin:0;box-shadow:none}@page{size:A4 portrait;margin:0}}@media(max-width:700px){.tools{margin:10px}.certificate{width:100vw;height:141.4286vw;margin:0;box-shadow:none}.tools button{font-size:14px}.recipient{font-size:3.15vw}.details{font-size:1.42vw}.issued-at{font-size:1.67vw}.certificate-number{font-size:1.17vw}}
</style>
</head>
<body>
<div class="tools"><button onclick="window.print()">PDF 저장·인쇄</button></div>
<section class="status" id="statusMessage" aria-live="polite"><h1>인증서를 확인하고 있습니다.</h1><p>잠시만 기다려 주세요.</p></section>
<main class="certificate" id="certificate" hidden aria-label="NCC 소비자선정 우수기업 인증서">
  <img class="template" src="images/certificate-reference-exact.png" alt="NCC 소비자선정 우수기업 인증서 공식 양식">
  <div class="slot recipient" id="name"></div>
  <dl class="details"><dt>대표자명</dt><dd id="representative"></dd><dt>선정번호</dt><dd id="selectionNumber"></dd><dt>선정부문</dt><dd id="category"></dd><dt>선정지역</dt><dd id="region"></dd></dl>
  <div class="slot issued-at" id="issuedAt"></div>
  <div class="slot certificate-number" id="number"></div>
  <div class="qr-wrap" id="qrCode" aria-label="공식 진위확인 QR 코드"></div>
</main>
<script src="js/vendor/qrcode.js?v=20260901-1"></script>
<script type="module" src="js/certificate-print.js?v=20260901-5"></script>
</body>
</html>
