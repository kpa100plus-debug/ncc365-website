<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>회원·인증서 공식 진위확인 | 전국소비자클럽</title>
  <meta name="description" content="전국소비자클럽 회원번호와 NCC 발급 인증번호의 현재 상태를 확인합니다.">
  <link rel="stylesheet" href="css/platform.css?v=20260826-1">
  <link rel="stylesheet" href="css/certificate-verify.css?v=20260824-1">
</head>
<body data-page="verify">
<main id="mainContent" class="platform-main">
  <section class="page-hero verification-hero">
    <p class="hero-kicker">NCC OFFICIAL VERIFICATION</p>
    <h1>회원·인증서<br>공식 진위확인</h1>
    <p class="lead">회원카드의 QR을 촬영하거나 회원번호·인증번호를 입력하면 현재 상태를 확인할 수 있습니다.</p>
  </section>

  <section class="platform-section paper verification-section">
    <div class="verify-shell">
      <div class="verify-heading">
        <p class="eyebrow">OFFICIAL LOOKUP</p>
        <h2>회원번호·인증번호 조회</h2>
        <p>회원카드 또는 인증서에 표시된 번호를 하이픈까지 그대로 입력해 주세요.</p>
      </div>

      <form id="verifyForm" class="verify-form" novalidate>
        <label for="certificateNumber">회원번호 또는 인증번호</label>
        <div class="verify-input-row">
          <input id="certificateNumber" name="id" inputmode="latin" autocomplete="off"
                 maxlength="50" placeholder="예: NCC-C-000011 또는 NCC-EC-2026-FD-0001" required>
          <button type="submit">공식 조회</button>
        </div>
      </form>

      <p id="verifyMessage" class="verify-message" role="status" aria-live="polite"></p>

      <section id="verifyResult" class="verify-result" hidden>
        <div class="result-status">
          <span id="statusIcon" aria-hidden="true">✓</span>
          <div>
            <p id="statusKicker">VERIFICATION RESULT</p>
            <h2 id="statusLabel">정상 발급</h2>
            <p id="statusDescription"></p>
          </div>
        </div>
        <dl class="certificate-data">
          <div><dt>조회 대상 유형</dt><dd id="resultType"></dd></div>
          <div><dt>회원번호 또는 인증번호</dt><dd id="resultNumber"></dd></div>
          <div><dt>이름</dt><dd id="resultName"></dd></div>
          <div><dt>현재 상태</dt><dd id="resultStatus"></dd></div>
          <div><dt>가입일 또는 발급일</dt><dd id="resultDate"></dd></div>
          <div><dt>유효 여부</dt><dd id="resultValidity"></dd></div>
          <div><dt>발급기관</dt><dd id="resultIssuer"></dd></div>
        </dl>
        <a id="certificateImageLink" class="certificate-image-link" href="#" target="_blank" rel="noopener" hidden>인증서 이미지 확인</a>
      </section>

    </div>
  </section>
</main>
<script src="js/platform-shell.js?v=20260826-1"></script>
<script type="module" src="js/certificate-verify.js?v=20260824-1"></script>
</body>
</html>
