name: NCC V1 isolated Firebase restore verification
on:
  push:
    branches: [backup/ncc-v1-encrypted-20260905]
    paths: [.github/workflows/ncc-v1-isolated-restore.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ncc-v1-isolated-restore-kpa-260905
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore saved encrypted backup into isolated Firebase only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
          NCC_E2E_ADMIN_EMAIL: ${{ secrets.NCC_E2E_ADMIN_EMAIL }}
          NCC_E2E_ADMIN_PASSWORD: ${{ secrets.NCC_E2E_ADMIN_PASSWORD }}
          NCC_E2E_D_EMAIL: ${{ secrets.NCC_E2E_D_EMAIL }}
          NCC_E2E_D_PASSWORD: ${{ secrets.NCC_E2E_D_PASSWORD }}
        shell: bash
        run: |
          umask 077
          cat > runner-key-seal.json <<'NCC_SEAL'
          {"meta":{"format":"NCC-RESTORE-RUNNER-KEY-SEAL-v1","repository":"kpa100plus-debug/ncc365-website","target":"ncc-v1-restore-kpa-260905","artifactId":9964069253,"artifactSha256":"38a973160e8446cf8a9c5bd0e0016f5c56820f5778c9a5bf45babecc781ea07d","expiresAt":"2026-09-06T08:00:00Z"},"aad":"{\"format\":\"NCC-RESTORE-RUNNER-KEY-SEAL-v1\",\"repository\":\"kpa100plus-debug/ncc365-website\",\"target\":\"ncc-v1-restore-kpa-260905\",\"artifactId\":9964069253,\"artifactSha256\":\"38a973160e8446cf8a9c5bd0e0016f5c56820f5778c9a5bf45babecc781ea07d\",\"expiresAt\":\"2026-09-06T08:00:00Z\"}","iv":"bpOZu6lUxLl1fpww","tag":"yfknZkeVkFYg+czZSOJfEw==","ciphertext":"","wrappedKeys":{"0fcb8909b32192ce39f4e783743e5fff44f8b33d":"","bf6ecd20a3b5b165ad8bfe3a47b5c0a0c01df89c":"","0cb6441464f31b689b7fd2fb9e10a002829480e4":"","faccccc65a9cf13c7e728ae83079fe618adf0624":""}}
          NCC_SEAL
          cat > restore.cjs <<'NCC_RESTORE'
          'use strict';
          // Isolated restore only. No production resource requests or writes.
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const {spawnSync} = require('node:child_process');
          const TARGET = 'ncc-v1-restore-kpa-260905';
          const REPO = 'kpa100plus-debug/ncc365-website';
          const ARTIFACT = 9964069253;
          const ZIP_HASH = '38a973160e8446cf8a9c5bd0e0016f5c56820f5778c9a5bf45babecc781ea07d';
          const TAR_HASH = '287c1c0cb872960a8194b2fdbc2e113d7f8ecd7d7cd2f9bbede49db0ed491865';
          const DB = `projects/${TARGET}/databases/(default)`;
          const DOCS = `https://firestore.googleapis.com/v1/${DB}/documents`;
          const AUTH = `https://identitytoolkit.googleapis.com/v1/projects/${TARGET}`;
          const RULES = `https://firebaserules.googleapis.com/v1/projects/${TARGET}`;
          const CONFIG = `https://identitytoolkit.googleapis.com/admin/v2/projects/${TARGET}/config`;
          const report = {reference:'REF-NCC-V1-ENCRYPTED-BACKUP-20260905-01',target:TARGET,sourceProject:'ncc-member',productionWrites:false,startedAt:new Date().toISOString(),checks:[],limitations:['Cloudflare Pages/D1 runtime is not verified by this Firebase restore.','Google OAuth, email delivery, push and real-device behavior are not verified.','Production secret environment values and full IAM/SSL settings are outside the captured backup.','Firestore server create/update times are regenerated in the isolated project.']};
          let root, input, token, keyForTarget, count=0;
          function guard(ok,code){if(!ok)throw new Error(code);}
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          function record(name,status,details={}){report.checks.push({name,status,...details});console.log('NCC_CHECK '+JSON.stringify({name,status,...details}));}
          function save(){if(root){fs.writeFileSync(path.join(root,'verification.json'),JSON.stringify(report,null,2),{mode:0o600});}}
          function canonical(v){if(Array.isArray(v))return v.map(canonical);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,k==='timestampValue'?new Date(v[k]).toISOString():canonical(v[k])]));return v;}
          const equal = (a,b) => JSON.stringify(canonical(a)) === JSON.stringify(canonical(b));
          function mapped(v){if(Array.isArray(v))return v.map(mapped);if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,value])=>[k,k==='referenceValue'?value.replace('projects/ncc-member/','projects/'+TARGET+'/'):mapped(value)]));return v;}
          function load(name){return JSON.parse(fs.readFileSync(path.join(input,name)));}
          function run(cmd,args){const r=spawnSync(cmd,args,{encoding:'utf8',maxBuffer:5*1024*1024});guard(r.status===0,'ARCHIVE_TOOL_FAILED');return r.stdout;}
          async function req(url,{method='GET',body,credential=token,expected=[200]}={}){
            guard(++count<3000,'REQUEST_LIMIT');
            const u = new URL(url);
            const scoped = (u.hostname==='firestore.googleapis.com'&&u.pathname.startsWith(`/v1/projects/${TARGET}/`)) || (u.hostname==='identitytoolkit.googleapis.com'&&(u.pathname.startsWith(`/v1/projects/${TARGET}/`)||u.pathname===`/admin/v2/projects/${TARGET}/config`)) || (u.hostname==='firebaserules.googleapis.com'&&u.pathname.startsWith(`/v1/projects/${TARGET}/`));
            const login = u.hostname==='identitytoolkit.googleapis.com'&&u.pathname==='/v1/accounts:signInWithPassword'&&u.searchParams.get('key')===keyForTarget&&keyForTarget;
            guard(u.protocol==='https:'&&!u.username&&!u.password&&(scoped||login),'TARGET_URL_GUARD');
            guard(['GET','POST','PATCH'].includes(method),'METHOD_GUARD');
            if(login)guard(credential===null&&method==='POST','LOGIN_GUARD');
            const r=await fetch(u,{method,redirect:'error',signal:AbortSignal.timeout(30000),headers:{...(credential?{Authorization:'Bearer '+credential}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
            const data=await r.json().catch(()=>({}));
            if(!expected.includes(r.status)){
              const e=new Error('HTTP_'+r.status);e.safe={host:u.hostname,path:u.pathname,http:r.status,status:data.error?.status,reason:(data.error?.details||[]).map(d=>d.reason).filter(Boolean)};throw e;
            }
            return {status:r.status,data};
          }
          async function authenticate(sa){
            guard(sa.project_id==='ncc-member'&&sa.client_email==='firebase-adminsdk-fbsvc@ncc-member.iam.gserviceaccount.com','IDENTITY_GUARD');
            const b64=v=>Buffer.from(JSON.stringify(v)).toString('base64url'),now=Math.floor(Date.now()/1000);
            const unsigned=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3600});
            const assertion=unsigned+'.'+crypto.createSign('RSA-SHA256').update(unsigned).sign(sa.private_key,'base64url');
            const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',redirect:'error',signal:AbortSignal.timeout(30000),body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
            guard(r.ok,'RUNNER_AUTH_FAILED'); token=(await r.json()).access_token;guard(token,'RUNNER_AUTH_FAILED');
          }
          async function recover(sa){
            const seal=JSON.parse(fs.readFileSync(path.join(__dirname,'runner-key-seal.json')));
            guard(seal.meta.target===TARGET&&seal.meta.repository===REPO&&seal.meta.artifactId===ARTIFACT&&seal.meta.artifactSha256===ZIP_HASH&&seal.aad===JSON.stringify(seal.meta),'SEAL_CONTEXT_GUARD');
            guard(Date.now()<Date.parse(seal.meta.expiresAt),'SEAL_EXPIRED');
            guard(seal.wrappedKeys[sa.private_key_id],'RUNNER_CERT_NOT_MATCHED');
            const wrappingKey=crypto.privateDecrypt({key:sa.private_key,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},Buffer.from(seal.wrappedKeys[sa.private_key_id],'base64'));
            const decipher=crypto.createDecipheriv('aes-256-gcm',wrappingKey,Buffer.from(seal.iv,'base64'));decipher.setAAD(Buffer.from(seal.aad));decipher.setAuthTag(Buffer.from(seal.tag,'base64'));
            const recoveryPrivate=Buffer.concat([decipher.update(Buffer.from(seal.ciphertext,'base64')),decipher.final()]);
            const r=await fetch(`https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT}/zip`,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},redirect:'manual',signal:AbortSignal.timeout(30000)});
            guard(r.status===302,'BACKUP_DOWNLOAD_REDIRECT_FAILED');const location=new URL(r.headers.get('location'));
            guard(location.protocol==='https:'&&(/\.blob\.core\.windows\.net$/.test(location.hostname)||/\.actions\.githubusercontent\.com$/.test(location.hostname)),'ARTIFACT_HOST_GUARD');
            const download=await fetch(location,{redirect:'error',signal:AbortSignal.timeout(90000)});guard(download.ok,'BACKUP_DOWNLOAD_FAILED');
            const zip=Buffer.from(await download.arrayBuffer());guard(hash(zip)===ZIP_HASH,'BACKUP_ZIP_HASH_FAILED');
            const zpath=path.join(root,'backup.zip');fs.writeFileSync(zpath,zip,{mode:0o600});
            const names=run('unzip',['-Z1',zpath]).trim().split('\n');guard(names.every(n=>['NCC_V1_20260905.encrypted.json','capture-status.json'].includes(n)),'ZIP_MEMBERS_GUARD');
            run('unzip',['-q',zpath,'-d',root]);
            const enc=JSON.parse(fs.readFileSync(path.join(root,'NCC_V1_20260905.encrypted.json')));
            guard(enc.format==='NCC-RSA-OAEP-SHA256-AES256GCM-v1'&&enc.plaintextSha256===TAR_HASH,'BACKUP_FORMAT_GUARD');
            const k=crypto.privateDecrypt({key:recoveryPrivate,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},Buffer.from(enc.wrappedKey,'base64'));
            const d=crypto.createDecipheriv('aes-256-gcm',k,Buffer.from(enc.iv,'base64'));d.setAuthTag(Buffer.from(enc.tag,'base64'));
            const tar=Buffer.concat([d.update(Buffer.from(enc.ciphertext,'base64')),d.final()]);guard(hash(tar)===TAR_HASH,'BACKUP_DECRYPT_HASH_FAILED');
            recoveryPrivate.fill(0);k.fill(0);wrappingKey.fill(0);
            const tpath=path.join(root,'backup.tar.gz');fs.writeFileSync(tpath,tar,{mode:0o600});
            guard(run('tar',['-tzf',tpath]).trim().split('\n').every(n=>!n.startsWith('/')&&!n.split('/').includes('..')),'TAR_PATH_GUARD');
            guard(run('tar',['-tvzf',tpath]).trim().split('\n').every(n=>['-','d'].includes(n[0])),'TAR_TYPE_GUARD');
            input=path.join(root,'input');fs.mkdirSync(input,{mode:0o700});run('tar',['-xzf',tpath,'-C',input,'--no-same-owner']);
            let files=0;for(const line of fs.readFileSync(path.join(input,'SHA256SUMS.txt'),'utf8').trim().split('\n')){const m=line.match(/^([a-f0-9]{64})  (.+)$/);guard(m&&!m[2].startsWith('/')&&!m[2].split('/').includes('..'),'MANIFEST_PATH_GUARD');guard(hash(fs.readFileSync(path.join(input,m[2])))===m[1],'MANIFEST_HASH_FAILED');files++;}
            const manifest=load('manifest.json');guard(manifest.project==='ncc-member'&&manifest.sourceCommit==='849b45158e7448135b27054e3b00ef6f4f6efdae','SOURCE_BASELINE_GUARD');
            record('saved_backup_integrity','PASS',{artifactId:ARTIFACT,zipSha256:ZIP_HASH,plaintextSha256:TAR_HASH,verifiedFiles:files});
          }
          async function users(){let all=[],next;do{const r=await req(AUTH+'/accounts:batchGet?maxResults=1000'+(next?'&nextPageToken='+encodeURIComponent(next):''));all.push(...r.data.users||[]);next=r.data.nextPageToken;guard(all.length<=1000,'USER_COUNT_GUARD');}while(next);return all;}
          async function restoreFirestore(){
            const documents=load('firestore-documents.json').documents;guard(documents.length===197,'SOURCE_DOC_COUNT_GUARD');
            const missing=[];
            for(const d of documents){guard(d.name.startsWith('projects/ncc-member/databases/(default)/documents/'),'SOURCE_DOCUMENT_GUARD');const r=await req(DOCS+'/'+d.name.split('/documents/')[1],{expected:[200,404]});if(r.status===404)missing.push(d);else guard(equal(r.data.fields||{},mapped(d.fields||{})),'EXISTING_TARGET_DOCUMENT_DIFFERS');}
            for(let i=0;i<missing.length;i+=100){const writes=missing.slice(i,i+100).map(d=>({update:{name:d.name.replace('projects/ncc-member/','projects/'+TARGET+'/'),fields:mapped(d.fields||{})},currentDocument:{exists:false}}));await req(DOCS+':commit',{method:'POST',body:{writes}});}
            for(const d of documents){const r=await req(DOCS+'/'+d.name.split('/documents/')[1]);guard(equal(r.data.fields||{},mapped(d.fields||{})),'RESTORED_DOCUMENT_DIFFERS');}
            record('firestore_cloud_roundtrip','PASS',{documents:documents.length,created:missing.length,collections:load('firestore-documents.json').collections.length,typesAndValuesCompared:true});
          }
          async function restoreUsers(){
            const original=load('firebase-auth-users.json').users;guard(original.length===10,'SOURCE_USER_COUNT_GUARD');
            const existing=await users();guard(existing.every(u=>original.some(v=>v.localId===u.localId&&v.email===u.email)),'UNEXPECTED_TARGET_USER');
            const incoming=original.filter(u=>!existing.some(v=>v.localId===u.localId));
            const h=load('firebase-auth-config.json').signIn.hashConfig;guard(h.algorithm==='SCRYPT'&&h.signerKey,'SCRYPT_CONFIG_GUARD');
            if(incoming.length){const r=await req(AUTH+'/accounts:batchCreate',{method:'POST',body:{users:incoming,hashAlgorithm:h.algorithm,signerKey:h.signerKey,saltSeparator:h.saltSeparator,rounds:h.rounds,memoryCost:h.memoryCost,sanityCheck:true,allowOverwrite:false}});guard(!(r.data.error||[]).length,'AUTH_IMPORT_PARTIAL_FAILURE');}
            const after=await users();guard(after.length===original.length,'RESTORED_USER_COUNT_DIFFERS');
            const fields=['email','emailVerified','disabled','displayName','photoUrl','phoneNumber','customAttributes','createdAt'];let hashes=0;
            for(const u of original){const v=after.find(v=>v.localId===u.localId);guard(v,'RESTORED_UID_MISSING');for(const key of fields)if(u[key]!==undefined)guard(equal(v[key],u[key]),'RESTORED_USER_FIELD_DIFFERS_'+key);for(const p of u.providerUserInfo||[]){if(['password','phone'].includes(p.providerId))continue;guard((v.providerUserInfo||[]).some(q=>q.providerId===p.providerId&&q.rawId===p.rawId),'RESTORED_PROVIDER_DIFFERS');}if(u.passwordHash&&v.passwordHash===u.passwordHash&&v.salt===u.salt)hashes++;}
            record('auth_cloud_roundtrip','PASS',{users:after.length,created:incoming.length,uidsAndProfilesCompared:true,matchingExportedPasswordHashes:hashes,passwordAlgorithm:'SCRYPT',passwordSignIn:'CHECKED_SEPARATELY'});
          }
          async function restoreRules(){
            const releases=load('firebase-rules-releases.json').releases;const release=releases.find(r=>r.name==='projects/ncc-member/releases/cloud.firestore');guard(release,'SOURCE_RULES_RELEASE_MISSING');
            const source=load('firebase-rulesets.json')[release.rulesetName].source;guard(source?.files?.length,'SOURCE_RULES_MISSING');
            const existing=await req(RULES+'/releases/cloud.firestore',{expected:[200,404]});let rulesetName;
            if(existing.status===200){const old=await req('https://firebaserules.googleapis.com/v1/'+existing.data.rulesetName);if(equal(old.data.source,source))rulesetName=existing.data.rulesetName;}
            if(!rulesetName){const created=await req(RULES+'/rulesets',{method:'POST',body:{source}});rulesetName=created.data.name;guard(rulesetName?.startsWith(`projects/${TARGET}/rulesets/`),'TARGET_RULESET_GUARD');
              if(existing.status===404)await req(RULES+'/releases',{method:'POST',body:{name:`projects/${TARGET}/releases/cloud.firestore`,rulesetName}});
              else await req(RULES+'/releases/cloud.firestore',{method:'PATCH',body:{release:{name:`projects/${TARGET}/releases/cloud.firestore`,rulesetName},updateMask:'rulesetName'}});
            }
            const live=await req(RULES+'/releases/cloud.firestore');guard(live.data.rulesetName===rulesetName,'RULES_RELEASE_DIFFERS');const liveSource=await req('https://firebaserules.googleapis.com/v1/'+rulesetName);guard(equal(liveSource.data.source,source),'RULES_SOURCE_DIFFERS');
            record('firestore_rules_cloud_restore','PASS',{files:source.files.length,sourceSha256:hash(Buffer.from(JSON.stringify(source)))});
          }
          async function loginTests(){
            const config=(await req(CONFIG)).data;keyForTarget=config.client?.apiKey;
            if(!keyForTarget){record('original_password_login','UNVERIFIED',{reason:'TARGET_CLIENT_API_KEY_UNAVAILABLE'});return;}
            const original=load('firebase-auth-users.json').users,documents=load('firestore-documents.json').documents;
            let tested=0;
            for(const label of ['ADMIN','D']){
              const email=process.env[`NCC_E2E_${label}_EMAIL`],password=process.env[`NCC_E2E_${label}_PASSWORD`];
              if(!email||!password||!original.some(u=>u.email?.toLowerCase()===email.toLowerCase())){record('original_password_login_'+label,'UNVERIFIED',{reason:'MATCHING_STORED_TEST_CREDENTIAL_UNAVAILABLE'});continue;}
              const r=await req('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(keyForTarget),{method:'POST',credential:null,body:{email,password,returnSecureToken:true},expected:[200,400,403]});
              if(r.status!==200){record('original_password_login_'+label,'FAIL',{http:r.status});continue;}
              const claims=JSON.parse(Buffer.from(r.data.idToken.split('.')[1],'base64url'));
              guard(claims.aud===TARGET&&claims.iss===`https://securetoken.google.com/${TARGET}`&&r.data.localId===original.find(u=>u.email?.toLowerCase()===email.toLowerCase()).localId,'LOGIN_TARGET_UID_GUARD');tested++;
              record('original_password_login_'+label,'PASS',{targetAudienceConfirmed:true,uidPreserved:true});
              const own=documents.find(d=>d.name.includes('/documents/members/')&&d.fields.authUid?.stringValue===r.data.localId);
              if(own){const read=await req(DOCS+'/'+own.name.split('/documents/')[1],{credential:r.data.idToken,expected:[200,403]});record('owner_member_read_'+label,read.status===200?'PASS':'FAIL',{http:read.status});}
              if(label==='D'){
                const other=documents.find(d=>d.name.includes('/documents/members/')&&d.fields.authUid?.stringValue&&d.fields.authUid.stringValue!==r.data.localId);
                if(other){const read=await req(DOCS+'/'+other.name.split('/documents/')[1],{credential:r.data.idToken,expected:[200,403]});record('unrelated_member_read_denied',read.status===403?'PASS':'FAIL',{http:read.status});}
              }
            }
            if(!tested)record('original_password_login','UNVERIFIED',{reason:'NO_SUCCESSFUL_ORIGINAL_PASSWORD_LOGIN'});
            const privateDoc=documents.find(d=>d.name.includes('/documents/members/')&&d.fields.authUid?.stringValue);
            if(privateDoc){const r=await req(DOCS+'/'+privateDoc.name.split('/documents/')[1],{credential:null,expected:[200,401,403]});record('anonymous_member_read_denied',[401,403].includes(r.status)?'PASS':'FAIL',{http:r.status});}
          }
          async function main(){
            guard(process.env.GITHUB_REPOSITORY===REPO&&process.env.GITHUB_REF==='refs/heads/backup/ncc-v1-encrypted-20260905','RUN_CONTEXT_GUARD');
            root=path.join(process.env.RUNNER_TEMP,'ncc-cloud-restore');fs.mkdirSync(root,{mode:0o700});
            const sa=JSON.parse(process.env.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON||'{}');await authenticate(sa);await recover(sa);
            const db=(await req('https://firestore.googleapis.com/v1/'+DB)).data;guard(db.name===DB&&db.type==='FIRESTORE_NATIVE'&&db.locationId==='asia-northeast3','DATABASE_ISOLATION_GUARD');
            record('isolated_target','PASS',{project:TARGET,region:db.locationId,freeTier:db.freeTier});
            // Publish and verify original security rules BEFORE placing any member data here.
            await restoreRules();await restoreFirestore();await restoreUsers();await loginTests();
            const indexes=(await req(`https://firestore.googleapis.com/v1/${DB}/collectionGroups/-/indexes`)).data.indexes||[];
            record('composite_index_count',indexes.length===0?'PASS':'FAIL',{source:0,target:indexes.length});
            report.overall=report.checks.some(c=>c.status==='FAIL')?'FAILED':'PARTIAL_PASS_FULL_RESTORE_GATE_NOT_PASSED';
          }
          if(require.main===module)main().catch(e=>{report.overall='FAILED';report.failure=/^[A-Z0-9_]+$/.test(e.message)?e.message:'ERROR_DETAILS_SUPPRESSED';if(e.safe)report.error=e.safe;console.error('NCC_RESTORE_STOP '+JSON.stringify({failure:report.failure,error:report.error}));process.exitCode=1;}).finally(()=>{report.finishedAt=new Date().toISOString();save();console.log('NCC_CLOUD_RESTORE_REPORT '+JSON.stringify(report));});
          module.exports={mapped,canonical,equal,TARGET};
          
          NCC_RESTORE
          node restore.cjs
      - name: Save counts and verification status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ncc-isolated-restore-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ncc-cloud-restore/verification.json
          if-no-files-found: error
          retention-days: 30
