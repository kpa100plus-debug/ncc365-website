<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCC 공식 인증서</title>
<style>
:root{--navy:#10234b;--gold:#b88925;--gold-light:#e7c978;--paper:#fffdf8;--ink:#24252a}
*{box-sizing:border-box} body{margin:0;background:#eaeee9;color:var(--ink);font-family:"Noto Serif KR","Malgun Myeongjo",serif}.tools{max-width:210mm;margin:18px auto;display:flex;justify-content:flex-end}.tools button{border:0;border-radius:8px;background:#b88925;color:#fff;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer}
.certificate{width:210mm;min-height:297mm;margin:0 auto 20px;padding:6mm;border:2px solid var(--gold);background:var(--paper);position:relative;box-shadow:0 12px 30px #10234b24;isolation:isolate}
.certificate:before,.certificate:after{content:"";position:absolute;inset:3mm;border:1px solid var(--gold-light);pointer-events:none}.certificate:after{inset:4.5mm;border:1px solid #ead79b}
.corner{position:absolute;width:22mm;height:22mm;border-color:#bd8c22;z-index:2}.corner.tl{top:3mm;left:3mm;border-top:3px solid;border-left:3px solid;border-radius:8mm 0 0}.corner.tr{top:3mm;right:3mm;border-top:3px solid;border-right:3px solid;border-radius:0 8mm 0 0}.corner.bl{bottom:3mm;left:3mm;border-bottom:3px solid;border-left:3px solid;border-radius:0 0 0 8mm}.corner.br{bottom:3mm;right:3mm;border-bottom:3px solid;border-right:3px solid;border-radius:0 0 8mm 0}
.content{min-height:282mm;padding:17mm 17mm 18mm;text-align:center;display:flex;flex-direction:column;align-items:center;position:relative;background-image:radial-gradient(#b8892518 1px,transparent 1px);background-size:8px 8px}
.kicker{margin:0;color:#a77718;letter-spacing:.22em;font-family:Arial,sans-serif;font-size:10px;font-weight:800}.title{margin:10mm 0 2mm;color:var(--navy);font-size:30px;line-height:1.28;letter-spacing:.05em;word-break:keep-all}.english{margin:0;color:#a77718;font-size:15px;letter-spacing:.04em;font-weight:700}.ornament{width:78%;display:flex;align-items:center;gap:8px;margin:5mm 0 4mm;color:#c39534}.ornament:before,.ornament:after{content:"";height:1px;background:linear-gradient(90deg,transparent,#c39534);flex:1}.ornament:after{background:linear-gradient(90deg,#c39534,transparent)}.crest{width:80mm;height:80mm;border-radius:50%;display:grid;place-items:center;position:relative;margin:1mm 0 3mm;background:radial-gradient(circle,#fffdf6 47%,#f0dfad 48%,#fffdf7 62%,#b88925 63%,#e8cb76 66%,#fffdf7 67%);box-shadow:0 0 0 1px #d5b25d,inset 0 0 0 5px #fff7dc}.crest:before,.crest:after{content:"";position:absolute;top:26mm;width:30mm;height:34mm;border:2px solid #dac27c;border-radius:65% 20% 65% 20%;opacity:.58;z-index:-1}.crest:before{right:63mm;transform:rotate(-24deg)}.crest:after{left:63mm;transform:scaleX(-1) rotate(-24deg)}.official-logo{max-width:59mm;max-height:43mm;object-fit:contain;filter:drop-shadow(0 2px 1px #98712040)}.recipient{margin:5mm 0 3mm;padding:0 8mm;min-height:17mm;color:var(--navy);font-size:28px;font-weight:800;letter-spacing:.08em;display:grid;place-items:center;word-break:keep-all}.fields{width:100%;max-width:136mm;border-top:1px solid #d8b861;border-bottom:1px solid #d8b861;padding:4mm 0;margin:1mm 0 4mm;font-size:16px;line-height:1.85}.field{display:flex;justify-content:center;gap:9mm}.label{min-width:34mm;text-align:right;color:#595348}.value{min-width:55mm;text-align:left;border-bottom:1px solid #d4c8a7;font-weight:700}.statement{max-width:145mm;margin:3mm 0 5mm;font-size:16px;line-height:1.85;word-break:keep-all}.date{font-size:16px;font-weight:700;letter-spacing:.04em}.issuer{margin:6mm 0 0;color:var(--navy);font-size:25px;letter-spacing:.07em;font-weight:800;line-height:1.4}.issuer-sub{margin:1mm 0 0;color:#a77718;font-size:15px;font-weight:700}.bottom{position:absolute;left:17mm;right:17mm;bottom:15mm;display:flex;justify-content:space-between;align-items:end;text-align:left}.serial{font-family:Arial,sans-serif;font-size:12px;font-weight:700;color:#272727}.serial span{display:block;margin-top:2mm;color:#756343}.verify{display:flex;align-items:end;gap:3mm;text-align:right}.verify img{width:25mm;height:25mm;background:#fff;padding:2mm;border:1px solid #b88925}.verify small{display:block;font-family:Arial,sans-serif;font-weight:800;line-height:1.4;color:#1f1f1f}.verification-url{font-family:Arial,sans-serif;font-size:10px;color:#735b29}.message{font-size:22px;color:var(--navy);font-weight:800;margin-top:12mm}
@media print{body{background:#fff}.tools{display:none}.certificate{margin:0;box-shadow:none;break-after:page}@page{size:A4 portrait;margin:0}}
@media(max-width:700px){.tools{margin:10px}.certificate{width:100%;min-height:0;padding:8px;margin:0}.content{min-height:0;padding:56px 24px 130px}.title{font-size:29px}.english{font-size:12px}.crest{transform:scale(.86);margin:-5mm 0}.recipient{font-size:25px}.fields,.statement,.date{font-size:15px}.issuer{font-size:22px}.bottom{left:22px;right:22px;bottom:35px}.verify img{width:76px;height:76px}.corner{width:60px;height:60px}}
</style>
</head>
<body>
<div class="tools"><button onclick="window.print()">PDF 저장·인쇄</button></div>
<main class="certificate">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <section class="content">
    <p class="kicker">NATIONAL CONSUMER CLUB · OFFICIAL CERTIFICATE</p>
    <h1 class="title" id="title">소비자선정 우수기업 인증서</h1>
    <p class="english" id="englishTitle">CONSUMER CHOICE EXCELLENT COMPANY</p>
    <div class="ornament">✦</div>
    <div class="crest"><img class="official-logo" src="images/NCC_OFFICIAL.png" alt="NCC 전국소비자클럽 공식 로고"></div>
    <p class="recipient" id="name">조회 중</p>
    <div class="fields">
      <div class="field" id="representativeRow"><span class="label">대표자</span><span class="value" id="representative">-</span></div>
      <div class="field" id="categoryRow"><span class="label">선정부문</span><span class="value" id="category">-</span></div>
      <div class="field" id="regionRow"><span class="label">선정지역</span><span class="value" id="region">-</span></div>
    </div>
    <p class="statement" id="statement">위 사업체는 상품과 서비스의 품질, 소비자 만족도 및 소비자 가치 향상을 위한 노력을 종합적으로 평가하여 소비자선정 우수기업으로 선정되었음을 인증합니다.</p>
    <p class="date" id="issuedAt"></p>
    <p class="issuer" id="issuer">전국소비자클럽</p>
    <p class="issuer-sub">NATIONAL CONSUMER CLUB · 소비자선정위원회</p>
    <div class="bottom">
      <p class="serial">인증번호 <strong id="number">-</strong><span id="validUntil"></span></p>
      <a class="verify" id="verifyLink" href="#" target="_blank" rel="noopener"><img id="qrCode" alt="공식 진위확인 QR"><small>공식 진위확인<br><span class="verification-url">ncc365.com</span></small></a>
    </div>
  </section>
</main>
<script type="module" src="js/certificate-print.js?v=20260901-1"></script>
</body>
</html>
