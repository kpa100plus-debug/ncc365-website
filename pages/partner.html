<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCC 기업·소상공인 파트너</title>
<link rel="stylesheet" href="../css/style.css?v=20260830-1">
</head>

<body>

<main class="partner" id="mainContent">

<h1>
전국소비자클럽<br>
기업·소상공인 파트너 등록
</h1>

<p>
좋은 상품과 서비스를 소비자에게 연결하고<br>
새로운 소비 가치를 함께 만듭니다.
</p>


<form>

<h2>01 사업자 정보</h2>

<input type="text" placeholder="업체명">

<br>

<select>
<option>사업자 구분</option>
<option>법인사업자</option>
<option>개인사업자</option>
</select>

<br>

<input type="text" placeholder="대표자명">

<br>

<input type="tel" placeholder="연락처">

<br>

<input type="text" placeholder="사업장 지역">


<h2>02 제공 혜택 정보</h2>

<input type="text" placeholder="업종">

<br>

<textarea placeholder="NCC 회원에게 제공 가능한 혜택"></textarea>


<h2>03 제휴 정보</h2>

<select>
<option>희망 제휴 방식</option>
<option>회원 할인</option>
<option>무료 경험 제공</option>
<option>공동구매 참여</option>
<option>지역 파트너 등록</option>
</select>


<h2>04 동의</h2>

<label>
<input type="checkbox">
파트너 등록 및 정보 활용에 동의합니다.
</label>


<br><br>

<button type="submit">
파트너 등록 신청
</button>


</form>

</main>

</body>
</html>
