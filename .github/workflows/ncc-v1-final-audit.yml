            const assertion=unsigned+'.'+crypto.createSign('RSA-SHA256').update(unsigned).sign(sa.private_key,'base64url');
            const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',redirect:'error',signal:AbortSignal.timeout(30000),body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
            guard(r.ok,'RUNNER_AUTH_FAILED'); token=(await r.json()).access_token;guard(token,'RUNNER_AUTH_FAILED');
