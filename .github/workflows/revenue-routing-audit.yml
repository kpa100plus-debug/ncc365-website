name: Revenue deployment routing audit
on:
  push:
    branches: [work/revenue-microsites-20260908]
    paths: [.github/workflows/revenue-routing-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect project routing without changing configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'JS'
          const token=process.env.CF_TOKEN,account=process.env.CF_ACCOUNT;
          if(!token||!account)throw Error('Existing Cloudflare credentials unavailable');
          fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects',{
            headers:{Authorization:'Bearer '+token}
          }).then(async r=>{
            if(!r.ok)throw Error('Cloudflare project read HTTP '+r.status);
            const p=await r.json();if(p.success===false)throw Error('Cloudflare project read failed');
            for(const x of p.result||[]){
              if(!['ncc365-website','daily-fortune-now','arcana-day'].includes(x.name))continue;
              const c=x.source?.config||{};
              console.log(JSON.stringify({project:x.name,production_branch:x.production_branch,
                source_type:x.source?.type,repository:c.repo_name,
                production_deployments_enabled:c.production_deployments_enabled,
                production_branch:c.production_branch||x.production_branch,
                path_includes:c.path_includes,path_excludes:c.path_excludes,
                preview_deployment_setting:c.preview_deployment_setting,
                production_deployment:x.canonical_deployment?.id,
                production_commit:x.canonical_deployment?.deployment_trigger?.metadata?.commit_hash}));
            }
          }).catch(e=>{console.error(e.message);process.exitCode=1});
          JS

      - name: Read public site metadata without loading advertising
        run: |
          node <<'JS'
          (async()=>{
            for(const [origin,paths] of [
              ['https://dtlabkr.dpdns.org',['/','/robots.txt','/sitemap.xml','/ads.txt','/legal/privacy/','/contact/']],
              ['https://daily-fortune-now.pages.dev',['/','/robots.txt','/sitemap.xml','/ads.txt','/privacy/','/contact/']],
              ['https://arcana-day.pages.dev',['/','/robots.txt','/sitemap.xml','/ads.txt','/privacy/','/contact/']]
            ]){
              for(const path of paths){
                const r=await fetch(origin+path,{signal:AbortSignal.timeout(20000)});
                const s=await r.text();
                const result={url:origin+path,status:r.status,final_url:r.url};
                if(path==='/'){
                  result.canonical=s.match(/<link[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)/i)?.[1]||null;
                  result.ad_client=s.match(/ca-pub-\d+/)?.[0]||null;
                }
                if(path==='/ads.txt')result.publisher_match=s.includes('google.com, pub-3207271051639372, DIRECT, f08c47fec0942fa0');
                if(path==='/robots.txt')result.sitemap=s.match(/Sitemap:\s*(\S+)/i)?.[1]||null;
                if(path==='/sitemap.xml')result.urls=(s.match(/<loc>/g)||[]).length;
                console.log(JSON.stringify(result));
                if(!r.ok)throw Error('Public route failed: '+origin+path);
              }
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
