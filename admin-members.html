<!doctype html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NCC 관리자 회원관리</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
background:#f5f8f6;
color:#12291c;
}

.wrap{
width:min(1100px,94%);
margin:40px auto;
}

h1{
margin-bottom:8px;
}

.info{
color:#66736b;
margin-bottom:25px;
}

.login-box{
max-width:460px;
margin:60px auto;
background:#fff;
padding:30px;
border-radius:18px;
box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.login-box h2{
margin-top:0;
}

input{
width:100%;
padding:15px;
margin-top:12px;
border:1px solid #d6dfd9;
border-radius:10px;
font-size:16px;
}

button{
border:0;
border-radius:10px;
padding:13px 18px;
font-size:15px;
font-weight:700;
cursor:pointer;
}

.login-button{
width:100%;
margin-top:18px;
background:#176b42;
color:white;
}

.logout-button{
background:#333;
color:white;
margin-bottom:20px;
}

.summary-box{
display:flex;
gap:12px;
flex-wrap:wrap;
margin:20px 0;
}

.summary-card{
background:#fff;
padding:18px 22px;
border-radius:12px;
min-width:160px;
box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.summary-label{
font-size:13px;
color:#66736b;
}

.summary-number{
font-size:28px;
font-weight:800;
margin-top:5px;
}

.search-box{
max-width:420px;
margin:10px 0 20px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:14px;
overflow:hidden;
}

th,
td{
padding:13px 10px;
border-bottom:1px solid #e5ebe6;
text-align:left;
font-size:14px;
}

th{
background:#176b42;
color:#fff;
}

.status{
font-weight:700;
color:#176b42;
}

.error{
margin-top:15px;
padding:14px;
background:#fff0f0;
color:#b00020;
border-radius:10px;
}

.empty{
padding:20px;
background:#fff;
border-radius:12px;
color:#66736b;
}

#adminArea{
display:none;
}

@media(max-width:700px){

.wrap{
width:96%;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

.summary-card{
flex:1;
min-width:140px;
}

}

</style>
</head>

<body>

<div class="wrap">

<div id="loginArea" class="login-box">

<h2>NCC 관리자 로그인</h2>

<p>관리자 계정으로 로그인하세요.</p>

<input
id="adminEmail"
type="email"
placeholder="관리자 이메일">

<input
id="adminPassword"
type="password"
placeholder="비밀번호">

<button
id="loginButton"
class="login-button">
관리자 로그인
</button>

<div id="loginError"></div>

</div>


<div id="adminArea">

<h1>전국소비자클럽 회원관리</h1>

<div class="info">
NCC 회원가입 데이터 관리
</div>

<div class="summary-box">

<div class="summary-card">
<div class="summary-label">전체 회원</div>
<div id="totalMembers" class="summary-number">0명</div>
</div>

<div class="summary-card">
<div class="summary-label">활성 회원</div>
<div id="activeMembers" class="summary-number">0명</div>
</div>

</div>

<input
id="memberSearch"
class="search-box"
type="text"
placeholder="이름, 연락처, 지역, 이메일 검색">

<br>

<button
id="logoutButton"
class="logout-button">
로그아웃
</button>

<div id="memberArea">
회원정보 불러오는 중...
</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBHL7qCPUwcp9Vp_1dYWfCk2qBvRgJ9mcM",

authDomain:
"ncc-member.firebaseapp.com",

projectId:
"ncc-member",

storageBucket:
"ncc-member.firebasestorage.app",

messagingSenderId:
"772423138834",

appId:
"1:772423138834:web:753b6d6dc6f394904822cb",

measurementId:
"G-2YR29B054J"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const loginArea =
document.getElementById("loginArea");

const adminArea =
document.getElementById("adminArea");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const loginError =
document.getElementById("loginError");

const memberArea =
document.getElementById("memberArea");

const totalMembers =
document.getElementById("totalMembers");

const activeMembers =
document.getElementById("activeMembers");

const memberSearch =
document.getElementById("memberSearch");

let allMembers = [];


loginButton.addEventListener("click",async()=>{

const email =
document.getElementById("adminEmail").value.trim();

const password =
document.getElementById("adminPassword").value;

loginError.innerHTML = "";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

loginError.innerHTML =
'<div class="error">로그인에 실패했습니다.<br>이메일 또는 비밀번호를 확인하세요.</div>';

}

});


logoutButton.addEventListener("click",async()=>{

await signOut(auth);

});


onAuthStateChanged(auth,(user)=>{

if(user){

loginArea.style.display="none";

adminArea.style.display="block";

loadMembers();

}else{

loginArea.style.display="block";

adminArea.style.display="none";

}

});


async function loadMembers(){

memberArea.innerHTML =
"회원정보 불러오는 중...";

try{

const q = query(
collection(db,"members"),
orderBy("joinDate","desc")
);

const snapshot =
await getDocs(q);

allMembers = [];

snapshot.forEach((doc)=>{

const d = doc.data();

let joinDate = "";

if(
d.joinDate &&
d.joinDate.toDate
){

joinDate =
d.joinDate
.toDate()
.toLocaleString("ko-KR");

}

allMembers.push({

id: doc.id,

name: d.name || "",

phone: d.phone || "",

region: d.region || "",

email: d.email || "",

benefit: d.benefit || "",

joinDate: joinDate,

status: d.status || ""

});

});


totalMembers.textContent =
allMembers.length + "명";

activeMembers.textContent =
allMembers.filter(
member => member.status === "active"
).length + "명";

renderMembers(allMembers);

}catch(error){

memberArea.innerHTML = `

<div class="error">
회원정보를 불러오지 못했습니다.<br>
${error.message}
</div>

`;

}

}


function renderMembers(list){

if(list.length === 0){

memberArea.innerHTML =
'<div class="empty">현재 표시할 회원이 없습니다.</div>';

return;

}

let rows = "";

list.forEach((d)=>{

rows += `

<tr>
<td>${d.name}</td>
<td>${d.phone}</td>
<td>${d.region}</td>
<td>${d.email}</td>
<td>${d.benefit}</td>
<td>${d.joinDate}</td>
<td class="status">${d.status}</td>
</tr>

`;

});


memberArea.innerHTML = `

<table>

<thead>

<tr>
<th>이름</th>
<th>연락처</th>
<th>지역</th>
<th>이메일</th>
<th>관심 혜택</th>
<th>가입일</th>
<th>상태</th>
</tr>

</thead>

<tbody>
${rows}
</tbody>

</table>

`;

}


memberSearch.addEventListener("input",()=>{

const keyword =
memberSearch.value.trim().toLowerCase();

const filtered =
allMembers.filter((member)=>{

return (

member.name.toLowerCase().includes(keyword) ||

member.phone.toLowerCase().includes(keyword) ||

member.region.toLowerCase().includes(keyword) ||

member.email.toLowerCase().includes(keyword)

);

});

renderMembers(filtered);

});

</script>

</body>

</html>
