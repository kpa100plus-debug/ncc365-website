          async function recover(sa){
            const seal=JSON.parse(fs.readFileSync(path.join(__dirname,'runner-key-seal.json')));
            guard(seal.meta.target===TARGET&&seal.meta.repository===REPO&&seal.meta.artifactId===ARTIFACT&&seal.meta.artifactSha256===ZIP_HASH&&seal.aad===JSON.stringify(seal.meta),'SEAL_CONTEXT_GUARD');
            guard(Date.now()<Date.parse(seal.meta.expiresAt),'SEAL_EXPIRED');
            guard(seal.wrappedKeys[sa.private_key_id],'RUNNER_CERT_NOT_MATCHED');
            const wrappingKey=crypto.privateDecrypt({key:sa.private_key,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},Buffer.from(seal.wrappedKeys[sa.private_key_id],'base64'));
            const decipher=crypto.createDecipheriv('aes-256-gcm',wrappingKey,Buffer.from(seal.iv,'base64'));decipher.setAAD(Buffer.from(seal.aad));decipher.setAuthTag(Buffer.from(seal.tag,'base64'));
            const recoveryPrivate=Buffer.concat([decipher.update(Buffer.from(seal.ciphertext,'base64')),decipher.final()]);
            const r=await fetch(`https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT}/zip`,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},redirect:'manual',signal:AbortSignal.timeout(30000)});
            guard(r.status===302,'BACKUP_DOWNLOAD_REDIRECT_FAILED');const location=new URL(r.headers.get('location'));
            guard(location.protocol==='https:'&&(/\.blob\.core\.windows\.net$/.test(location.hostname)||/\.actions\.githubusercontent\.com$/.test(location.hostname)),'ARTIFACT_HOST_GUARD');
            const download=await fetch(location,{redirect:'error',signal:AbortSignal.timeout(90000)});guard(download.ok,'BACKUP_DOWNLOAD_FAILED');
            const zip=Buffer.from(await download.arrayBuffer());guard(hash(zip)===ZIP_HASH,'BACKUP_ZIP_HASH_FAILED');
            const zpath=path.join(root,'backup.zip');fs.writeFileSync(zpath,zip,{mode:0o600});
            const names=run('unzip',['-Z1',zpath]).trim().split('\n');guard(names.every(n=>['NCC_V1_20260905.encrypted.json','capture-status.json'].includes(n)),'ZIP_MEMBERS_GUARD');
            run('unzip',['-q',zpath,'-d',root]);
            const enc=JSON.parse(fs.readFileSync(path.join(root,'NCC_V1_20260905.encrypted.json')));
            guard(enc.format==='NCC-RSA-OAEP-SHA256-AES256GCM-v1'&&enc.plaintextSha256===TAR_HASH,'BACKUP_FORMAT_GUARD');
            const k=crypto.privateDecrypt({key:recoveryPrivate,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},Buffer.from(enc.wrappedKey,'base64'));
            const d=crypto.createDecipheriv('aes-256-gcm',k,Buffer.from(enc.iv,'base64'));d.setAuthTag(Buffer.from(enc.tag,'base64'));
            const tar=Buffer.concat([d.update(Buffer.from(enc.ciphertext,'base64')),d.final()]);guard(hash(tar)===TAR_HASH,'BACKUP_DECRYPT_HASH_FAILED');
            recoveryPrivate.fill(0);k.fill(0);wrappingKey.fill(0);
            const tpath=path.join(root,'backup.tar.gz');fs.writeFileSync(tpath,tar,{mode:0o600});
            guard(run('tar',['-tzf',tpath]).trim().split('\n').every(n=>!n.startsWith('/')&&!n.split('/').includes('..')),'TAR_PATH_GUARD');
            guard(run('tar',['-tvzf',tpath]).trim().split('\n').every(n=>['-','d'].includes(n[0])),'TAR_TYPE_GUARD');
            input=path.join(root,'input');fs.mkdirSync(input,{mode:0o700});run('tar',['-xzf',tpath,'-C',input,'--no-same-owner']);
            let files=0;for(const line of fs.readFileSync(path.join(input,'SHA256SUMS.txt'),'utf8').trim().split('\n')){const m=line.match(/^([a-f0-9]{64})  (.+)$/);guard(m&&!m[2].startsWith('/')&&!m[2].split('/').includes('..'),'MANIFEST_PATH_GUARD');guard(hash(fs.readFileSync(path.join(input,m[2])))===m[1],'MANIFEST_HASH_FAILED');files++;}
            const manifest=load('manifest.json');guard(manifest.project==='ncc-member'&&manifest.sourceCommit==='849b45158e7448135b27054e3b00ef6f4f6efdae','SOURCE_BASELINE_GUARD');
            record('saved_backup_integrity','PASS',{artifactId:ARTIFACT,zipSha256:ZIP_HASH,plaintextSha256:TAR_HASH,verifiedFiles:files});
          }
          async function users(){let all=[],next;do{const r=await req(AUTH+'/accounts:batchGet?maxResults=1000'+(next?'&nextPageToken='+encodeURIComponent(next):''));all.push(...r.data.users||[]);next=r.data.nextPageToken;guard(all.length<=1000,'USER_COUNT_GUARD');}while(next);return all;}
          
