<style>

}

body{

.header{

}


.logo img{

width:190px;

}



.container{

width:min(700px,92%);

}



.card{

background:#fff;

border-radius:22px;

padding:35px 30px;

box-shadow:0 15px 40px rgba(0,0,0,.06);

}



.eyebrow{

font-size:12px;

}



h1{

.subtitle{

}



.benefits{

button{

.notice{

.card{

<body>


<header class="header">

<a class="logo" href="index.html">

<img src="images/NCC_header_logo.png"
alt="전국소비자클럽 공식 로고">

</header>



<div class="container">


<div class="card">


<p class="eyebrow">
FREE MEMBERSHIP
</p>


<h1>

전국소비자클럽<br>

<span>무료 회원가입</span>

</h1>


<p class="subtitle">

가입비 0원.<br>

공동구매, 회원 할인,

<div class="benefits">


<div class="benefit">

<div class="benefit">

<div class="form-group">

<label>
이름 *

<input id="name" placeholder="이름을 입력하세요">

</div>



<div class="form-group">

<label>
연락처 *

<input id="phone" placeholder="010-0000-0000">

</div>



<div class="form-group">

<label>
거주지역 *
</label>

<input id="region" placeholder="지역을 입력하세요">

<div class="form-group">

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyBHL7qCPUwcp9Vp_1dYWfCk2qBvRgJ9mcM",
authDomain: "ncc-member.firebaseapp.com",
projectId: "ncc-member",
storageBucket: "ncc-member.firebasestorage.app",
messagingSenderId: "772423138834",
appId: "1:772423138834:web:753b6d6dc6f394904822cb",
measurementId: "G-2YR29B054J"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
document.getElementById("memberForm").addEventListener("submit", async function(e){

e.preventDefault();

const memberData = {

name: document.getElementById("name").value,

phone: document.getElementById("phone").value,

region: document.getElementById("region").value,

email: document.getElementById("email").value,

memberType: "consumer",

status: "active",

joinDate: new Date()

};


await addDoc(collection(db,"members"), memberData);
console.log("Firestore 저장 완료", memberData);

alert("전국소비자클럽 회원가입이 완료되었습니다.");

});

</script>
