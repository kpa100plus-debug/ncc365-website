name: NCC Test Payment Provision

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/configure-ncc-firebase-email.mjs"
      - ".github/scripts/configure-ncc-payment-pages.mjs"
      - ".github/workflows/ncc-payment-provision.yml"
      - "functions/api/payments/**"
      - "functions/api/account/**"
      - "migrations/**"

permissions:
  contents: read

concurrency:
  group: ncc-test-payment-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision D1 and configure Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
      NCC_D1_DATABASE_NAME: ncc-test-payments
      WRANGLER_VERSION: 4.126.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for variable_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: ${variable_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install pinned Wrangler CLI
        run: npm install --global "wrangler@${WRANGLER_VERSION}"

      - name: Create or reuse test payment D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          list_file="${RUNNER_TEMP}/ncc-d1-list.json"
          wrangler d1 list --json > "$list_file"
          database_id="$(jq -r --arg name "$NCC_D1_DATABASE_NAME" '.[] | select(.name == $name) | (.uuid // .id // empty)' "$list_file" | head -n 1)"
          if [ -z "$database_id" ]; then
            wrangler d1 create "$NCC_D1_DATABASE_NAME" --location apac > /dev/null
            wrangler d1 list --json > "$list_file"
            database_id="$(jq -r --arg name "$NCC_D1_DATABASE_NAME" '.[] | select(.name == $name) | (.uuid // .id // empty)' "$list_file" | head -n 1)"
          fi
          if [ -z "$database_id" ]; then
            echo "::error::D1 database could not be resolved after provisioning"
            exit 1
          fi
          echo "::add-mask::$database_id"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "D1 database is ready."

      - name: Apply idempotent payment and account schemas
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" \
            --remote \
            --file migrations/0001_ncc_test_payments.sql \
            --yes
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" \
            --remote \
            --file migrations/0002_ncc_account_indexes.sql \
            --yes
          schema_file="${RUNNER_TEMP}/ncc-d1-schema-check.json"
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" \
            --remote \
            --command "SELECT name FROM sqlite_schema WHERE type='table' AND name IN ('payments','payment_events','member_verifications','member_recovery_index','account_recovery_attempts','account_admin_audit') ORDER BY name" \
            --json > "$schema_file"
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const rows=new Set(data.flatMap(x=>x.results||[]).map(x=>x.name));for(const name of ["payments","payment_events","member_verifications","member_recovery_index","account_recovery_attempts","account_admin_audit"]){if(!rows.has(name))throw new Error(`D1 schema verification failed: ${name}`)}' "$schema_file"

      - name: Configure Firebase account-administration credential
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON" |
            wrangler pages secret put FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON --project-name ncc365-website
          echo "Firebase account-administration credential is configured."

      - name: Configure and verify Korean Firebase reset email
        run: node .github/scripts/configure-ncc-firebase-email.mjs

      - name: Bind Pages, redeploy, and verify test mode
        env:
          NCC_PAYMENTS_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: node .github/scripts/configure-ncc-payment-pages.mjs
