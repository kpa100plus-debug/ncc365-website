    paths: [.github/workflows/ncc-v1-isolated-edge.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ncc-v1-isolated-edge-260905
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
