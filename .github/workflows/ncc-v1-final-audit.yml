          function norm(v){if(Array.isArray(v))return v.map(norm);if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).filter(([k])=>!['createTime','updateTime','etag','state','indexId'].includes(k)).map(([k,v])=>[k,norm(v)]));return typeof v==='string'?v.replaceAll('projects/ncc-member/','projects/PROJECT/').replaceAll('projects/'+TARGET+'/','projects/PROJECT/'):v;}
          function encryptedSave(){const plain=Buffer.from(JSON.stringify(captured));const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),c=crypto.createCipheriv('aes-256-gcm',key,iv);const ciphertext=Buffer.concat([c.update(plain),c.final()]);const envelope={format:'NCC-RSA-OAEP-SHA256-AES256GCM-JSON-v1',plaintextSha256:hash(plain),iv:iv.toString('base64'),tag:c.getAuthTag().toString('base64'),wrappedKey:crypto.publicEncrypt({key:fs.readFileSync(path.join(__dirname,'recovery-public.pem')),padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),ciphertext:ciphertext.toString('base64')};fs.writeFileSync(path.join(root,'NCC_V1_readonly_config_20260906.encrypted.json'),JSON.stringify(envelope),{mode:0o600});plain.fill(0);key.fill(0);record('configuration_evidence_encrypted','PASS',{plaintextSha256:envelope.plaintextSha256,captureSections:Object.keys(captured).filter(k=>!['capturedAt','sourceProject','targetProject'].includes(k))});}
          async function main(){
           guard(process.env.GITHUB_REPOSITORY===REPO&&process.env.GITHUB_REF==='refs/heads/backup/ncc-v1-encrypted-20260905','RUN_CONTEXT_GUARD');
           root=path.join(process.env.RUNNER_TEMP,'ncc-cloud-restore');fs.mkdirSync(root,{mode:0o700});const sa=JSON.parse(process.env.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON||'{}');await authenticate(sa);await recover(sa);
           await test('isolated_database',async()=>{const db=(await req('https://firestore.googleapis.com/v1/'+DB)).data;guard(db.name===DB&&db.type==='FIRESTORE_NATIVE'&&db.locationId==='asia-northeast3','DATABASE_ISOLATION_GUARD');record('isolated_database','PASS',{project:TARGET,region:db.locationId});});
           await test('firestore_saved_values',async()=>{const docs=load('firestore-documents.json').documents;guard(docs.length===197,'SOURCE_DOC_COUNT_GUARD');let checked=0;for(let i=0;i<docs.length;i+=5)await Promise.all(docs.slice(i,i+5).map(async d=>{guard(d.name.startsWith('projects/ncc-member/databases/(default)/documents/'),'SOURCE_DOCUMENT_GUARD');const actual=(await req(DOCS+'/'+d.name.split('/documents/')[1])).data;guard(equal(actual.fields||{},mapped(d.fields||{})),'DOCUMENT_VALUES_DIFFER');checked++;}));record('firestore_saved_values','PASS',{documents:checked,canonicalTypedValues:true,extraDocumentsNotEnumerated:true});});
           await test('restored_member_identity',async()=>{const original=load('firebase-auth-users.json').users,actual=await users();guard(original.length===10&&actual.length===10,'USER_COUNT_DIFFERS');for(const u of original){const v=actual.find(v=>v.localId===u.localId);guard(v&&v.email===u.email&&!!v.disabled===!!u.disabled&&v.createdAt===u.createdAt,'USER_IDENTITY_DIFFERS');}const admin=actual.find(v=>v.localId==='tdTkMf7K6YUWRgLrdL4oLWhlmif2');record('restored_member_identity','PASS',{users:actual.length,uidEmailDisabledCreatedAt:true,passwordResetPreserved:true});record('administrator_google_provider_link',admin?.providerUserInfo?.some(p=>p.providerId==='google.com')?'PASS':'FAIL',{sameRestoredUid:true,interactiveLoginScreenVerified:false});});
