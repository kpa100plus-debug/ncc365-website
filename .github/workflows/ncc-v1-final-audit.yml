          function normalizeTimestamp(value){const m=value.match(/^(.*T\d{2}:\d{2}:\d{2})(?:\.(\d{1,9}))?Z$/);guard(m,'TIMESTAMP_FORMAT_GUARD');return m[1]+'.'+(m[2]||'').padEnd(9,'0')+'Z';}
          function canonical(v){if(Array.isArray(v))return v.map(canonical);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,k==='timestampValue'?normalizeTimestamp(v[k]):canonical(v[k])]));return v;}
          const equal = (a,b) => JSON.stringify(canonical(a)) === JSON.stringify(canonical(b));
