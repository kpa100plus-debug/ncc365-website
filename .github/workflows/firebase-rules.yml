name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ncc-member
          workload_identity_provider: projects/772423138834/locations/global/workloadIdentityPools/ncc-github-actions/providers/github
          service_account: ncc-firestore-rules-deployer@ncc-member.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate and deploy Firestore rules
        run: firebase deploy --only firestore:rules --project ncc-member --non-interactive
