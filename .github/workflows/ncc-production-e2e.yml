name: NCC Production E2E

on:
  workflow_dispatch:
    inputs:
      confirm_member_number:
        description: "안전 확인용 테스트 회원번호"
        required: true
        default: "NCC-C-000016"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/e2e-triggers/ncc-member-d.txt"

permissions:
  contents: read

concurrency:
  group: ncc-production-e2e
  cancel-in-progress: false

jobs:
  test-member-d:
    if: ${{ github.event_name == 'push' || inputs.confirm_member_number == 'NCC-C-000016' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NCC_BASE_URL: https://ncc365.com
      NCC_E2E_D_EMAIL: ${{ secrets.NCC_E2E_D_EMAIL }}
      NCC_E2E_D_PASSWORD: ${{ secrets.NCC_E2E_D_PASSWORD }}
      NCC_E2E_ADMIN_EMAIL: ${{ secrets.NCC_E2E_ADMIN_EMAIL }}
      NCC_E2E_ADMIN_PASSWORD: ${{ secrets.NCC_E2E_ADMIN_PASSWORD }}
      NCC_E2E_D_MEMBER_NUMBER: NCC-C-000016
      NCC_E2E_D_MEMBER_NAME: 테스트회원D
      NCC_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NCC_D1_DATABASE_NAME: ncc-test-payments
      WRANGLER_VERSION: 4.126.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate secret configuration
        shell: bash
        run: |
          missing=0
          for secret_name in NCC_E2E_D_EMAIL NCC_E2E_D_PASSWORD NCC_E2E_ADMIN_EMAIL NCC_E2E_ADMIN_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install pinned browser and D1 cleanup runtimes
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          npm install --global "wrangler@${WRANGLER_VERSION}"

      - name: Wait for the audited payment API deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error https://ncc365.com/api/payments/config | jq -e '.enabled == true and .mode == "test" and .realCharge == false and .auditVersion == "2026-08-26-admin-route-auth"' > /dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Audited payment API deployment was not visible within 6 minutes."
          exit 1

      - name: Recover the exact stranded record from failed run 32955211041
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$NCC_E2E_D_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "::error::Test member email failed strict validation; refusing recovery."
            exit 1
          fi
          start="2026-08-26T09:52:00.000Z"
          end="2026-08-26T09:54:00.000Z"
          where_clause="member_email = '$NCC_E2E_D_EMAIL' AND test_mode = 1 AND created_at >= '$start' AND created_at < '$end'"
          count_file="${RUNNER_TEMP}/ncc-stranded-count.json"
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --command "SELECT COUNT(*) AS count FROM payments WHERE $where_clause" --json > "$count_file"
          count="$(node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).flatMap(x=>x.results||[]);process.stdout.write(String(Number(rows[0]?.count||0)))' "$count_file")"
          if [ "$count" -gt 1 ]; then
            echo "::error::Recovery window matched more than one payment; refusing destructive cleanup."
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            recovery_sql="DELETE FROM payment_events WHERE payment_id IN (SELECT id FROM payments WHERE $where_clause); DELETE FROM payments WHERE $where_clause;"
            wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --command "$recovery_sql" --yes > /dev/null
          fi
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --command "SELECT COUNT(*) AS count FROM payments WHERE $where_clause" --json > "$count_file"
          node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).flatMap(x=>x.results||[]);if(Number(rows[0]?.count)!==0)throw new Error("Stranded test-payment recovery verification failed")' "$count_file"
          echo "The narrowly scoped failed-run payment record is absent or was removed and verified."

      - name: Run protected NCC member lifecycle test
        run: node .github/scripts/ncc-d-e2e.mjs

      - name: Remove temporary test-payment records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_file="artifacts/ncc-e2e-result.json"
          if [ ! -f "$result_file" ]; then
            echo "::error::Protected E2E result is missing; D1 cleanup cannot be proven."
            exit 1
          fi
          prepared="$(jq -r '.checks.testPaymentPrepared // false' "$result_file")"
          if [ "$prepared" != "true" ]; then
            echo "No temporary D1 payment was prepared."
            exit 0
          fi
          receipt="$(jq -r '.testOrderReceipt // empty' "$result_file")"
          if [[ ! "$receipt" =~ ^NCC-G-[0-9-]{8,40}$ ]]; then
            echo "::error::Automation receipt failed strict validation; refusing D1 cleanup."
            exit 1
          fi
          cleanup_sql="DELETE FROM payment_events WHERE payment_id IN (SELECT id FROM payments WHERE order_receipt = '$receipt' AND test_mode = 1 AND status IN ('refunded','cancelled')); DELETE FROM payments WHERE order_receipt = '$receipt' AND test_mode = 1 AND status IN ('refunded','cancelled');"
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --command "$cleanup_sql" --yes > /dev/null
          verify_file="${RUNNER_TEMP}/ncc-payment-cleanup.json"
          wrangler d1 execute "$NCC_D1_DATABASE_NAME" --remote --command "SELECT COUNT(*) AS count FROM payments WHERE order_receipt = '$receipt'" --json > "$verify_file"
          node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).flatMap(x=>x.results||[]);if(Number(rows[0]?.count)!==0)throw new Error("Temporary D1 payment cleanup verification failed")' "$verify_file"
          node -e 'const fs=require("fs");const p=process.argv[1];const data=JSON.parse(fs.readFileSync(p,"utf8"));data.checks.testPaymentDataRemoved=true;fs.writeFileSync(p,JSON.stringify(data,null,2)+"\n")' "$result_file"
          echo "Temporary test-payment data was removed and verified."

      - name: Upload redacted test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncc-e2e-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ncc-e2e-result.json
          if-no-files-found: warn
          retention-days: 7
