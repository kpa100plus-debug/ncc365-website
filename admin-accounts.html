<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="NCC 회원 탈퇴요청과 계정변경 이력을 관리합니다.">
  <title>회원 계정관리 | NCC 통합관리자</title>
  <link rel="stylesheet" href="css/platform.css">
  <link rel="stylesheet" href="css/role-dashboard.css">
  <link rel="stylesheet" href="css/admin-accounts.css">
</head>
<body class="role-page">
<main class="role-shell">
  <section class="role-hero">
    <div>
      <p class="role-kicker">NCC MEMBER ACCOUNT CONTROL</p>
      <h1>회원 탈퇴요청·<br>계정변경 기록</h1>
      <p class="role-lead">탈퇴요청을 승인·반려하고 회원정보 변경 이력을 안전하게 확인합니다.</p>
    </div>
    <div class="role-member-card">
      <span>개인정보 처리·관리 주체</span>
      <strong>㈜ISEA GROUP</strong>
      <p>처리 담당자·시간 기록</p>
      <p>관리자 인증 필수</p>
    </div>
  </section>

  <section class="role-admin-panel">
    <div id="adminAccountLogin">
      <h2>관리자 로그인</h2>
      <div class="role-filter">
        <input id="adminEmail" type="email" autocomplete="username" placeholder="관리자 이메일">
        <input id="adminPassword" type="password" autocomplete="current-password" placeholder="비밀번호">
        <button id="adminLoginButton" class="role-button" type="button">로그인</button>
      </div>
      <p id="adminAccountMessage" class="role-status"></p>
    </div>

    <div id="adminAccountArea" hidden>
      <div class="role-toolbar">
        <p>탈퇴 승인 시 회원계정은 즉시 차단됩니다. Firebase Authentication 최종 삭제는 별도 보안처리가 필요합니다.</p>
        <div><a class="role-button light" href="admin.html">통합관리</a> <button id="adminLogoutButton" class="role-button" type="button">로그아웃</button></div>
      </div>

      <div class="account-summary" aria-label="탈퇴요청 요약">
        <article><span>전체 요청</span><strong id="totalRequests">0</strong></article>
        <article><span>처리 대기</span><strong id="pendingRequests">0</strong></article>
        <article><span>승인</span><strong id="approvedRequests">0</strong></article>
        <article><span>반려</span><strong id="rejectedRequests">0</strong></article>
      </div>

      <div class="account-tabs" role="tablist" aria-label="회원 계정관리 메뉴">
        <button class="account-tab active" type="button" data-account-tab="requests">탈퇴요청 처리</button>
        <button class="account-tab" type="button" data-account-tab="logs">계정변경 로그</button>
      </div>

      <section id="requestPanel" class="account-panel">
        <div class="account-filter">
          <input id="requestSearch" type="search" placeholder="회원명·회원번호·이메일 검색">
          <select id="requestStatus">
            <option value="">전체 상태</option>
            <option value="requested">접수</option>
            <option value="reviewing">검토 중</option>
            <option value="approved">승인</option>
            <option value="rejected">반려</option>
          </select>
          <button id="accountRefresh" class="role-button light" type="button">새로고침</button>
        </div>
        <p id="requestMessage" class="role-status" aria-live="polite"></p>
        <div id="requestList" class="account-list"><div class="role-empty">탈퇴요청을 불러오고 있습니다.</div></div>
      </section>

      <section id="logPanel" class="account-panel" hidden>
        <div class="account-filter">
          <input id="logSearch" type="search" placeholder="회원명·회원번호·변경항목 검색">
          <select id="logType">
            <option value="">전체 변경유형</option>
            <option value="basic_profile_updated">기본정보 변경</option>
            <option value="email_synced">이메일 변경 완료</option>
            <option value="email_change_requested">이메일 변경 요청</option>
            <option value="password_reset_requested">비밀번호 재설정 요청</option>
            <option value="deletion_requested">탈퇴 요청</option>
            <option value="deletion_reviewing">탈퇴 검토</option>
            <option value="deletion_approved">탈퇴 승인</option>
            <option value="deletion_rejected">탈퇴 반려</option>
            <option value="admin_role_updated">관리자 역할·소속 변경</option>
          </select>
          <button id="logRefresh" class="role-button light" type="button">새로고침</button>
        </div>
        <div id="logList" class="audit-list"><div class="role-empty">계정변경 로그를 불러오고 있습니다.</div></div>
      </section>
    </div>
  </section>
</main>
<script type="module" src="js/admin-accounts.js?v=20260823-01"></script>
</body>
</html>
