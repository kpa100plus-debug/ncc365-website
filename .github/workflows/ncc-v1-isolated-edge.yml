          const DB = `projects/${TARGET}/databases/(default)`;
          const DOCS = `https://firestore.googleapis.com/v1/${DB}/documents`;
          const AUTH = `https://identitytoolkit.googleapis.com/v1/projects/${TARGET}`;
          const RULES = `https://firebaserules.googleapis.com/v1/projects/${TARGET}`;
